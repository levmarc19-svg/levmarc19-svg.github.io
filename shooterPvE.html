
<!DOCTYPE html>
<html>
<head>
  <title>Parabola Game</title>
  <style>
    * { font-family: monospace; box-sizing: border-box; }
    body { padding: 10px; background: #eee; }
    canvas { border: 1px solid #aaa; background: white; display: block; }
    input { width: 60px; padding: 4px; border: 1px solid #aaa; border-radius: 4px; }
    button { padding: 4px 10px; cursor: pointer; border: 1px solid #aaa; border-radius: 4px; }
    #msg { color: red; font-weight: bold; margin-top: 6px; min-height: 1.2em; }
    #hud { margin: 0 0 6px; color: #555; font-size: 13px; }
    .controls { margin-top: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  </style>
</head>
<body>

<h1>Parabola Game</h1>
<p id="hud"></p>
<canvas id="c" width="600" height="700"></canvas>

<div class="controls">
  <span>y =</span>
  <input id="inputA" placeholder="a">
  <span>x² +</span>
  <input id="inputB" placeholder="b">
  <span>x</span>
  <button onclick="shoot()">Shoot</button>
  <button onclick="startGame()">Reset</button>
</div>
<div id="msg"></div>

<script>

var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");

var CANVAS_WIDTH  = 600;
var CANVAS_HEIGHT = 700;
var CELL_WIDTH    = 60;
var CELL_HEIGHT   = 70;

var level;
var shotsLeft;
var playerX, playerY;
var enemyX, enemyY;
var pastShots = [];
var isShooting = false;

// -----------------------------------------------------------
// PARTICLES
// Each particle is one orange dot flying outward from the
// hit position. We store all active particles in this array.
// -----------------------------------------------------------
var particles = [];


function gridToPixel(gridX, gridY) {
  return {
    px: gridX * CELL_WIDTH,
    py: CANVAS_HEIGHT - gridY * CELL_HEIGHT
  };
}

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function placeDots() {
  playerX = randomInt(1, 3);
  playerY = randomInt(1, 4);
  enemyX  = randomInt(6, 9);
  enemyY  = randomInt(1, 4);
}


// -----------------------------------------------------------
// SPAWN EXPLOSION
// Creates 12 orange particles flying out in all directions
// from the pixel position where the shot hit.
// -----------------------------------------------------------

function spawnExplosion(px, py) {
  particles = [];

  var numParticles = 12;

  for (var i = 0; i < numParticles; i++) {

    // Spread particles evenly around a full circle
    var angle = (i / numParticles) * Math.PI * 2;

    // Random speed between 2 and 5 pixels per frame
    var speed = 2 + Math.random() * 3;

    particles.push({
      x:      px,                        // current x position (pixels)
      y:      py,                        // current y position (pixels)
      vx:     Math.cos(angle) * speed,   // x velocity
      vy:     Math.sin(angle) * speed,   // y velocity
      life:   1.0,                       // fades from 1 down to 0
      radius: 4 + Math.random() * 3      // size of the dot
    });
  }
}


// -----------------------------------------------------------
// DRAW AND UPDATE PARTICLES
// Called every frame of the explosion animation.
// Moves each particle outward and fades it out.
// Returns true if any particles are still alive.
// -----------------------------------------------------------

function drawAndUpdateParticles() {
  var anyAlive = false;

  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];

    if (p.life <= 0) continue;

    // Move the particle outward
    p.x = p.x + p.vx;
    p.y = p.y + p.vy;

    // Shrink life each frame so it fades out
    p.life = p.life - 0.04;

    // Draw as an orange dot — opacity matches life
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 140, 0, " + p.life + ")";
    ctx.fill();

    anyAlive = true;
  }

  return anyAlive;
}


// -----------------------------------------------------------
// ANIMATE EXPLOSION
// Loops with requestAnimationFrame, redrawing the scene and
// the particles each frame, until all particles have faded.
// Then calls the "done" callback to move to the next level.
// -----------------------------------------------------------

function animateExplosion(done) {
  draw();
  var stillGoing = drawAndUpdateParticles();

  if (stillGoing) {
    requestAnimationFrame(function () {
      animateExplosion(done);
    });
  } else {
    setTimeout(done, 200);
  }
}


// -----------------------------------------------------------
// DRAW
// -----------------------------------------------------------

function draw() {
  ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

  // Grid lines
  ctx.strokeStyle = "rgba(0, 0, 0, 0.1)";
  for (var col = 0; col <= 10; col++) {
    ctx.beginPath();
    ctx.moveTo(col * CELL_WIDTH, 0);
    ctx.lineTo(col * CELL_WIDTH, CANVAS_HEIGHT);
    ctx.stroke();
  }
  for (var row = 0; row <= 10; row++) {
    ctx.beginPath();
    ctx.moveTo(0, row * CELL_HEIGHT);
    ctx.lineTo(CANVAS_WIDTH, row * CELL_HEIGHT);
    ctx.stroke();
  }

  // Axis numbers
  ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
  ctx.font = "11px monospace";
  for (var i = 1; i <= 10; i++) {
    ctx.fillText(i, i * CELL_WIDTH + 2, CANVAS_HEIGHT - 4);
    ctx.fillText(i, 2, CANVAS_HEIGHT - i * CELL_HEIGHT - 2);
  }

  // Past shots (faded blue)
  ctx.strokeStyle = "rgba(100, 100, 255, 0.25)";
  ctx.lineWidth = 1.5;
  for (var s = 0; s < pastShots.length; s++) {
    var path = pastShots[s];
    ctx.beginPath();
    for (var p = 0; p < path.length; p++) {
      if (p === 0) ctx.moveTo(path[p].px, path[p].py);
      else ctx.lineTo(path[p].px, path[p].py);
    }
    ctx.stroke();
  }
  ctx.lineWidth = 1;

  // Player dot (cyan)
  var player = gridToPixel(playerX, playerY);
  ctx.beginPath();
  ctx.arc(player.px, player.py, 7, 0, Math.PI * 2);
  ctx.fillStyle = "#0cc";
  ctx.fill();
  ctx.fillStyle = "#555";
  ctx.font = "11px monospace";
  ctx.fillText("(" + playerX + "," + playerY + ")", player.px + 9, player.py - 5);

  // Enemy dot (red)
  var enemy = gridToPixel(enemyX, enemyY);
  ctx.beginPath();
  ctx.arc(enemy.px, enemy.py, 7, 0, Math.PI * 2);
  ctx.fillStyle = "#e44";
  ctx.fill();
  ctx.fillStyle = "#555";
  ctx.fillText("(" + enemyX + "," + enemyY + ")", enemy.px + 9, enemy.py - 5);
}


// -----------------------------------------------------------
// SHOOT
// -----------------------------------------------------------

function shoot() {
  if (isShooting) return;
  if (shotsLeft <= 0) { setMessage("No shots left — press Reset!"); return; }

  var a = parseFloat(document.getElementById("inputA").value);
  var b = parseFloat(document.getElementById("inputB").value);

  if (isNaN(a) || isNaN(b)) { setMessage("Please enter values for a and b."); return; }

  if (Math.abs(a) < 0.1) { setMessage("a cannot be 0 (or near 0). Try -0.5"); return; }

  a = Math.max(-2, Math.min(2, a));
  b = Math.max(-10, Math.min(10, b));

  // Force a to be negative so the parabola always curves downward
  if (a > 0) {
    a = -a;
  }

  isShooting = true;
  setMessage("");

  var path = [];
  var t = 0;

  function step() {
    var worldX = playerX + t;
    var worldY = playerY + (a * t * t + b * t);
    var pos = gridToPixel(worldX, worldY);

    path.push(pos);

    draw();

    // Draw the shot trail
    ctx.beginPath();
    ctx.strokeStyle = "rgba(0,0,0,0.7)";
    for (var i = 0; i < path.length; i++) {
      if (i === 0) ctx.moveTo(path[i].px, path[i].py);
      else ctx.lineTo(path[i].px, path[i].py);
    }
    ctx.stroke();

    // Draw the moving projectile dot
    ctx.beginPath();
    ctx.arc(pos.px, pos.py, 4, 0, Math.PI * 2);
    ctx.fillStyle = "blue";
    ctx.fill();

    if (isNearEnemy(pos.px, pos.py)) {
      finishShot(path, true, pos.px, pos.py);
      return;
    }

    t = t + 0.05;

    if (worldX > 0 && worldX < 10 && worldY > 0 && worldY < 10) {
      requestAnimationFrame(step);
    } else {
      finishShot(path, false, pos.px, pos.py);
    }
  }

  step();
}


function isNearEnemy(px, py) {
  var enemy = gridToPixel(enemyX, enemyY);
  var dx = px - enemy.px;
  var dy = py - enemy.py;
  return Math.sqrt(dx * dx + dy * dy) < 12;
}


// -----------------------------------------------------------
// FINISH SHOT
// On a hit: spawn the explosion, animate it, then next level.
// On a miss: just update the HUD and redraw normally.
// -----------------------------------------------------------

function finishShot(path, didHit, hitPx, hitPy) {
  isShooting = false;

  pastShots.push(path);
  if (pastShots.length > 20) pastShots.shift();

  shotsLeft = shotsLeft - 1;

  if (didHit) {
    setMessage("Hit!");
    spawnExplosion(hitPx, hitPy);
    animateExplosion(function () {
      // This runs after the explosion finishes
      level = level + 1;
      shotsLeft = 5;
      pastShots = [];
      particles = [];
      placeDots();
      updateHUD();
      draw();
    });
  } else {
    if (shotsLeft <= 0) {
      setMessage("Out of shots! Answer was: " + getAnswer());
    } else {
      setMessage("Miss!");
    }
    updateHUD();
    draw();
  }
}


function getAnswer() {
  var dx = enemyX - playerX;
  var dy = enemyY - playerY;
  var a = -0.2;
  var b = (dy - a * dx * dx) / dx;
  return a.toFixed(2) + "x² + " + b.toFixed(2) + "x";
}

function updateHUD() {
  document.getElementById("hud").textContent =
    "Level: " + level + " | Shots left: " + shotsLeft;
}

function setMessage(text) {
  document.getElementById("msg").textContent = text;
}

function startGame() {
  level     = 1;
  shotsLeft = 5;
  pastShots = [];
  particles = [];
  isShooting = false;
  placeDots();
  setMessage("");
  updateHUD();
  draw();
}

startGame();

</script>
</body>
</html>
