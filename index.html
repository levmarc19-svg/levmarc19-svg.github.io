
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Math Attaque</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>

    /* ============================================================
       GLOBAL RESET + THEME
    ============================================================ */
    :root {
      --red:    #e02020;
      --white:  #ffffff;
      --black:  #000000;
      --grey:   #aaaaaa;
      --grid-line: rgba(255,255,255,0.09);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: var(--black);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      color: var(--white);
    }

    /* ── SHARED GRID BACKGROUND ─────────────────────────────── */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    /* ── SCREEN BASE ────────────────────────────────────────── */
    /* Every "page" is stacked full-viewport. JS swaps them. */
    .screen {
      position: fixed;
      inset: 0;
      display: none;               /* hidden by default */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--black);
    }

    .screen.active { display: flex; }   /* JS adds this to show a screen */

    /* ── SHARED TITLE LOGO ──────────────────────────────────── */
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 8vw, 96px);
      letter-spacing: 5px;
      color: var(--white);
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }

    .logo .star { color: var(--red); }

    .logo-underline {
      width: min(480px, 72vw);
      height: 2px;
      background: var(--white);
      margin-bottom: 50px;
    }

    /* ── SHARED MENU BUTTON STYLE ───────────────────────────── */
    .menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .btn {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(18px, 2.8vw, 26px);
      letter-spacing: 4px;
      color: var(--white);
      background: transparent;
      border: 2px solid rgba(255,255,255,0.25);
      padding: 13px 60px;
      min-width: 280px;
      text-align: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    /* Red sweep on hover */
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--red);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.22s ease;
      z-index: 0;
    }

    .btn:hover::before  { transform: scaleX(1); }
    .btn:hover          { border-color: var(--red); }

    /* Button label sits above the sweep */
    .btn span { position: relative; z-index: 1; }

    /* Red-filled primary button */
    .btn.primary {
      background: var(--red);
      border-color: var(--red);
    }

    /* Dimmed/disabled button (Coming Soon) */
    .btn.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: rgba(255,255,255,0.1);
    }

    .btn.disabled::before { display: none; }

    /* "Coming Soon" badge under disabled buttons */
    .coming-soon {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--grey);
      text-transform: uppercase;
      margin-top: -8px;
    }

    /* ── USERNAME INPUT ─────────────────────────────────────── */
    .username-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 50px;
    }

    .username-row label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      color: var(--grey);
    }

    .username-row input {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      background: transparent;
      border: none;
      border-bottom: 2px solid rgba(255,255,255,0.3);
      color: var(--white);
      padding: 4px 8px;
      width: 200px;
      outline: none;
      transition: border-color 0.2s;
    }

    .username-row input::placeholder { color: rgba(255,255,255,0.2); }
    .username-row input:focus        { border-color: var(--red); }


    /* ============================================================
       SCREEN 1 — INTRO (video slots)
       Replace the src="" values with your video URLs.
    ============================================================ */
    #screen-intro { background: var(--black); }

    #intro-video {
      width: min(500px, 80vw);
      height: min(500px, 80vw);
      object-fit: contain;
      display: block;
      position: relative;
      z-index: 1;
    }


    /* ============================================================
       SCREEN 2 — HOME
       Your background image shows here.
       Replace url('') with your image URL/path.
    ============================================================ */
    #screen-home { justify-content: center; }

    .home-bg {
      position: absolute;
      inset: 0;
      background-image: url('Home_Page_Background.png'); /* ← your image here */
      background-size: cover;
      background-position: top center;
      z-index: 0;
    }

    .home-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.2) 0%,
        rgba(0,0,0,0.6) 55%,
        rgba(0,0,0,0.95) 100%
      );
      z-index: 1;
    }

    .home-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }


    /* ============================================================
       SCREEN 3 — MODE SELECT (Play → PvE / PvP / Sandbox)
    ============================================================ */
    #screen-mode { background: var(--black); }

    .back-btn {
      position: absolute;
      top: 24px;
      left: 28px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 3px;
      color: var(--grey);
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    .back-btn:hover { color: var(--white); }

    .mode-subtitle {
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--grey);
      text-transform: uppercase;
      margin-bottom: 48px;
    }


    /* ============================================================
       SCREEN 4 — GAME (the parabola canvas)
    ============================================================ */
    #screen-game {
      background: #000;
      overflow-y: auto;
      padding: 20px;
      align-items: flex-start;
      justify-content: flex-start;
    }

    #screen-game .back-btn { color: #555; }
    #screen-game .back-btn:hover { color: #000; }

    #game-wrap {
      margin-top: 40px;   /* space below the back button */
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    /* Game title in dark theme to match site */
    #game-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 4px;
      color: #333;
      margin-bottom: 6px;
    }

    #hud {
      margin: 0 0 6px;
      color: #555;
      font-size: 13px;
      font-family: monospace;
    }

    canvas {
      border: 1px solid #aaa;
      background: white;
      display: block;
    }

    .controls {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-family: monospace;
    }

    .controls input {
      font-family: monospace;
      width: 60px;
      padding: 4px;
      border: 1px solid #aaa;
      border-radius: 4px;
      background: white;
      color: #000;
    }

    .controls button {
      font-family: monospace;
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      border-radius: 4px;
      background: white;
    }

    #msg {
      color: red;
      font-weight: bold;
      margin-top: 6px;
      min-height: 1.2em;
      font-family: monospace;
    }

  </style>
</head>
<body>


  <!-- ============================================================
       SCREEN 1 — INTRO VIDEOS
       Slot 1: Opening logo animation
       Slot 2: Loading screen animation
       To use: set the src attributes to your video file paths or URLs.
  ============================================================ -->
  <div id="screen-intro" class="screen active">
    <div class="grid-bg"></div>

    <!--
      VIDEO SLOT 1 — Opening logo video
      Replace src="" with your video path, e.g. src="Opening_Scene.mp4"
    -->
    <video id="video-opening" muted playsinline preload="auto"
           src="Opening_Scene.mp4"
           style="position:relative;z-index:1;width:min(500px,80vw);height:min(500px,80vw);object-fit:contain;display:block;">
    </video>

    <!--
      VIDEO SLOT 2 — Loading screen video (hidden until slot 1 ends)
      Replace src="" with your video path, e.g. src="Loading_screen__1_.mp4"
    -->
    <video id="video-loading" muted playsinline preload="auto"
           src="Loading_screen__1_.mp4"
           style="position:relative;z-index:1;width:min(500px,80vw);height:min(500px,80vw);object-fit:contain;display:none;">
    </video>

  </div>


  <!-- ============================================================
       SCREEN 2 — HOME MENU
  ============================================================ -->
  <div id="screen-home" class="screen">
    <div class="home-bg"></div>
    <div class="home-overlay"></div>

    <div class="home-content">

      <div class="logo">Math&nbsp;Att<span class="star">✦</span>que</div>
      <div class="logo-underline"></div>

      <!-- Username field -->
      <div class="username-row">
        <label for="username-input">Player:</label>
        <input id="username-input" type="text" placeholder="Enter username" maxlength="20">
      </div>

      <nav class="menu">
        <button class="btn primary" onclick="goTo('screen-mode')">
          <span>Play</span>
        </button>
      </nav>

    </div>
  </div>


  <!-- ============================================================
       SCREEN 3 — MODE SELECT
  ============================================================ -->
  <div id="screen-mode" class="screen">
    <div class="grid-bg"></div>

    <button class="back-btn" onclick="goTo('screen-home')">← Back</button>

    <div class="logo" style="font-size: clamp(32px,5vw,60px); margin-bottom:4px;">
      Select Mode
    </div>
    <div class="logo-underline" style="margin-bottom:10px;"></div>
    <p class="mode-subtitle">Choose your battlefield</p>

    <nav class="menu">

      <!-- PvE — leads to the game -->
      <button class="btn primary" onclick="goTo('screen-game'); startGame();">
        <span>PvE</span>
      </button>

      <!-- PvP — coming soon -->
      <button class="btn disabled" disabled>
        <span>PvP</span>
      </button>
      <p class="coming-soon">Coming Soon</p>

      <!-- Sandbox — coming soon -->
      <button class="btn disabled" disabled>
        <span>Sandbox</span>
      </button>
      <p class="coming-soon">Coming Soon</p>

    </nav>
  </div>


  <!-- ============================================================
       SCREEN 4 — PARABOLA GAME
  ============================================================ -->
  <div id="screen-game" class="screen">

    <button class="back-btn" onclick="goTo('screen-mode')">← Back</button>

    <div id="game-wrap">
      <div id="game-title">Math Att✦que — PvE</div>
      <p id="hud"></p>
      <canvas id="c" width="600" height="700"></canvas>

      <div class="controls">
        <span>y =</span>
        <input id="inputA" placeholder="a">
        <span>x² +</span>
        <input id="inputB" placeholder="b">
        <span>x</span>
        <button onclick="shoot()">Shoot</button>
        <button onclick="startGame()">Reset</button>
      </div>
      <div id="msg"></div>
    </div>

  </div>


  <script>

    // ============================================================
    // SCREEN NAVIGATION
    // goTo("screen-id") hides all screens and shows the chosen one.
    // ============================================================

    function goTo(screenId) {
      var allScreens = document.querySelectorAll(".screen");
      for (var i = 0; i < allScreens.length; i++) {
        allScreens[i].classList.remove("active");
      }
      document.getElementById(screenId).classList.add("active");
    }


    // ============================================================
    // INTRO VIDEO SEQUENCE
    // Plays video 1, then video 2, then goes to the home screen.
    // If either video is missing or blocked, skips after a timeout.
    // ============================================================

    var videoOpening = document.getElementById("video-opening");
    var videoLoading = document.getElementById("video-loading");

    function playOpeningVideo() {
      videoOpening.style.display = "block";
      videoLoading.style.display = "none";

      var fallback = setTimeout(playLoadingVideo, 6000);

      videoOpening.addEventListener("ended", function () {
        clearTimeout(fallback);
        playLoadingVideo();
      });

      videoOpening.addEventListener("error", function () {
        clearTimeout(fallback);
        playLoadingVideo();
      });

      videoOpening.play().catch(function () {
        clearTimeout(fallback);
        playLoadingVideo();
      });
    }

    function playLoadingVideo() {
      videoOpening.style.display = "none";
      videoLoading.style.display = "block";

      var fallback = setTimeout(goToHome, 7000);

      videoLoading.addEventListener("ended", function () {
        clearTimeout(fallback);
        goToHome();
      });

      videoLoading.addEventListener("error", function () {
        clearTimeout(fallback);
        goToHome();
      });

      videoLoading.play().catch(function () {
        clearTimeout(fallback);
        goToHome();
      });
    }

    function goToHome() {
      goTo("screen-home");
    }

    // Kick off the intro
    playOpeningVideo();


    // ============================================================
    // PARABOLA GAME
    // ============================================================

    var canvas = document.getElementById("c");
    var ctx = canvas.getContext("2d");

    var CANVAS_WIDTH  = 600;
    var CANVAS_HEIGHT = 700;
    var CELL_WIDTH    = 60;
    var CELL_HEIGHT   = 70;

    var level;
    var shotsLeft;
    var playerX, playerY;
    var enemyX, enemyY;
    var pastShots = [];
    var isShooting = false;
    var particles  = [];


    function gridToPixel(gridX, gridY) {
      return {
        px: gridX * CELL_WIDTH,
        py: CANVAS_HEIGHT - gridY * CELL_HEIGHT
      };
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function placeDots() {
      playerX = randomInt(1, 3);
      playerY = randomInt(1, 4);
      enemyX  = randomInt(6, 9);
      enemyY  = randomInt(1, 4);
    }

    // ── EXPLOSION ───────────────────────────────────────────────

    function spawnExplosion(px, py) {
      particles = [];
      var numParticles = 12;
      for (var i = 0; i < numParticles; i++) {
        var angle = (i / numParticles) * Math.PI * 2;
        var speed = 2 + Math.random() * 3;
        particles.push({
          x: px, y: py,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          radius: 4 + Math.random() * 3
        });
      }
    }

    function drawAndUpdateParticles() {
      var anyAlive = false;
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        if (p.life <= 0) continue;
        p.x = p.x + p.vx;
        p.y = p.y + p.vy;
        p.life = p.life - 0.04;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 140, 0, " + p.life + ")";
        ctx.fill();
        anyAlive = true;
      }
      return anyAlive;
    }

    function animateExplosion(done) {
      draw();
      var stillGoing = drawAndUpdateParticles();
      if (stillGoing) {
        requestAnimationFrame(function () { animateExplosion(done); });
      } else {
        setTimeout(done, 200);
      }
    }

    // ── DRAW ────────────────────────────────────────────────────

    function draw() {
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // Grid lines
      ctx.strokeStyle = "rgba(0, 0, 0, 0.1)";
      for (var col = 0; col <= 10; col++) {
        ctx.beginPath();
        ctx.moveTo(col * CELL_WIDTH, 0);
        ctx.lineTo(col * CELL_WIDTH, CANVAS_HEIGHT);
        ctx.stroke();
      }
      for (var row = 0; row <= 10; row++) {
        ctx.beginPath();
        ctx.moveTo(0, row * CELL_HEIGHT);
        ctx.lineTo(CANVAS_WIDTH, row * CELL_HEIGHT);
        ctx.stroke();
      }

      // Axis numbers
      ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
      ctx.font = "11px monospace";
      for (var i = 1; i <= 10; i++) {
        ctx.fillText(i, i * CELL_WIDTH + 2, CANVAS_HEIGHT - 4);
        ctx.fillText(i, 2, CANVAS_HEIGHT - i * CELL_HEIGHT - 2);
      }

      // Past shots
      ctx.strokeStyle = "rgba(100, 100, 255, 0.25)";
      ctx.lineWidth = 1.5;
      for (var s = 0; s < pastShots.length; s++) {
        var path = pastShots[s];
        ctx.beginPath();
        for (var p = 0; p < path.length; p++) {
          if (p === 0) ctx.moveTo(path[p].px, path[p].py);
          else ctx.lineTo(path[p].px, path[p].py);
        }
        ctx.stroke();
      }
      ctx.lineWidth = 1;

      // Player dot (cyan)
      var player = gridToPixel(playerX, playerY);
      ctx.beginPath();
      ctx.arc(player.px, player.py, 7, 0, Math.PI * 2);
      ctx.fillStyle = "#0cc";
      ctx.fill();
      ctx.fillStyle = "#555";
      ctx.font = "11px monospace";
      ctx.fillText("(" + playerX + "," + playerY + ")", player.px + 9, player.py - 5);

      // Enemy dot (red)
      var enemy = gridToPixel(enemyX, enemyY);
      ctx.beginPath();
      ctx.arc(enemy.px, enemy.py, 7, 0, Math.PI * 2);
      ctx.fillStyle = "#e44";
      ctx.fill();
      ctx.fillStyle = "#555";
      ctx.fillText("(" + enemyX + "," + enemyY + ")", enemy.px + 9, enemy.py - 5);
    }

    // ── SHOOT ───────────────────────────────────────────────────

    function shoot() {
      if (isShooting) return;
      if (shotsLeft <= 0) { setMessage("No shots left — press Reset!"); return; }

      var a = parseFloat(document.getElementById("inputA").value);
      var b = parseFloat(document.getElementById("inputB").value);

      if (isNaN(a) || isNaN(b)) { setMessage("Please enter values for a and b."); return; }
      if (Math.abs(a) < 0.1)    { setMessage("a cannot be 0 (or near 0). Try -0.5"); return; }

      a = Math.max(-2, Math.min(2, a));
      b = Math.max(-10, Math.min(10, b));

      if (a > 0) { a = -a; }

      isShooting = true;
      setMessage("");

      var path = [];
      var t = 0;

      function step() {
        var worldX = playerX + t;
        var worldY = playerY + (a * t * t + b * t);
        var pos = gridToPixel(worldX, worldY);

        path.push(pos);
        draw();

        ctx.beginPath();
        ctx.strokeStyle = "rgba(0,0,0,0.7)";
        for (var i = 0; i < path.length; i++) {
          if (i === 0) ctx.moveTo(path[i].px, path[i].py);
          else ctx.lineTo(path[i].px, path[i].py);
        }
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(pos.px, pos.py, 4, 0, Math.PI * 2);
        ctx.fillStyle = "blue";
        ctx.fill();

        if (isNearEnemy(pos.px, pos.py)) {
          finishShot(path, true, pos.px, pos.py);
          return;
        }

        t = t + 0.05;

        if (worldX > 0 && worldX < 10 && worldY > 0 && worldY < 10) {
          requestAnimationFrame(step);
        } else {
          finishShot(path, false, pos.px, pos.py);
        }
      }

      step();
    }

    function isNearEnemy(px, py) {
      var enemy = gridToPixel(enemyX, enemyY);
      var dx = px - enemy.px;
      var dy = py - enemy.py;
      return Math.sqrt(dx * dx + dy * dy) < 12;
    }

    function finishShot(path, didHit, hitPx, hitPy) {
      isShooting = false;
      pastShots.push(path);
      if (pastShots.length > 20) pastShots.shift();
      shotsLeft = shotsLeft - 1;

      if (didHit) {
        setMessage("Hit!");
        spawnExplosion(hitPx, hitPy);
        animateExplosion(function () {
          level = level + 1;
          shotsLeft = 5;
          pastShots = [];
          particles = [];
          placeDots();
          updateHUD();
          draw();
        });
      } else {
        if (shotsLeft <= 0) {
          setMessage("Out of shots! Answer was: " + getAnswer());
        } else {
          setMessage("Miss!");
        }
        updateHUD();
        draw();
      }
    }

    function getAnswer() {
      var dx = enemyX - playerX;
      var dy = enemyY - playerY;
      var a  = -0.2;
      var b  = (dy - a * dx * dx) / dx;
      return a.toFixed(2) + "x² + " + b.toFixed(2) + "x";
    }

    function updateHUD() {
      document.getElementById("hud").textContent =
        "Level: " + level + " | Shots left: " + shotsLeft;
    }

    function setMessage(text) {
      document.getElementById("msg").textContent = text;
    }

    function startGame() {
      level      = 1;
      shotsLeft  = 5;
      pastShots  = [];
      particles  = [];
      isShooting = false;
      placeDots();
      setMessage("");
      updateHUD();
      draw();
    }

  </script>
</body>
</html>
