
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Math Attaque</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>

    :root {
      --red:       #e02020;
      --white:     #ffffff;
      --black:     #000000;
      --grey:      #aaaaaa;
      --grid-line: rgba(255,255,255,0.09);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: var(--black);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      color: var(--white);
      cursor: none;
    }

    #custom-cursor {
      position: fixed; top: 0; left: 0;
      width: 20px; height: 20px;
      pointer-events: none; z-index: 99999;
      transform: translate(-50%, -50%);
    }

    .grid-bg {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.18) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none; z-index: 0;
    }

    .screen {
      position: fixed; inset: 0;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--black);
    }
    .screen.active { display: flex; }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 8vw, 96px);
      letter-spacing: 5px; color: var(--white);
      display: flex; align-items: center;
      margin-bottom: 6px; position: relative; z-index: 2;
    }
    .logo .star { color: var(--red); }

    .logo-underline {
      width: min(480px, 72vw); height: 2px;
      background: var(--white); margin-bottom: 40px;
      position: relative; z-index: 2;
    }

    .menu {
      display: flex; flex-direction: column;
      align-items: center; gap: 14px;
      position: relative; z-index: 2;
    }

    .btn {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(18px, 2.8vw, 26px);
      letter-spacing: 4px; color: var(--white);
      background: transparent;
      border: 2px solid rgba(255,255,255,0.25);
      padding: 13px 60px; min-width: 280px;
      text-align: center; cursor: none;
      position: relative; overflow: hidden;
      transition: border-color 0.2s;
    }
    .btn::before {
      content: ''; position: absolute; inset: 0;
      background: var(--red); transform: scaleX(0);
      transform-origin: left; transition: transform 0.22s ease; z-index: 0;
    }
    .btn:hover::before { transform: scaleX(1); }
    .btn:hover         { border-color: var(--red); }
    .btn span          { position: relative; z-index: 1; }
    .btn.primary       { background: var(--red); border-color: var(--red); }
    .btn.disabled      { opacity: 0.4; cursor: none; border-color: rgba(255,255,255,0.1); }
    .btn.disabled::before { display: none; }

    .coming-soon {
      font-size: 11px; letter-spacing: 2px; color: var(--grey);
      text-transform: uppercase; margin-top: -8px;
      position: relative; z-index: 2;
    }

    .back-btn {
      position: absolute; top: 24px; left: 28px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px; letter-spacing: 3px;
      color: var(--grey); background: none; border: none;
      cursor: none; transition: color 0.2s; z-index: 10;
    }
    .back-btn:hover { color: var(--white); }

    .username-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 8px; position: relative; z-index: 2;
    }
    .username-row label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px; letter-spacing: 3px; color: var(--grey);
    }
    .username-row input {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px; letter-spacing: 3px;
      background: transparent; border: none;
      border-bottom: 2px solid rgba(255,255,255,0.3);
      color: var(--white); padding: 4px 8px;
      width: 200px; outline: none;
      transition: border-color 0.2s; cursor: none;
    }
    .username-row input::placeholder { color: rgba(255,255,255,0.2); }
    .username-row input:focus        { border-color: var(--red); }

    #username-error {
      font-family: 'Rajdhani', sans-serif; font-size: 13px;
      font-weight: 600; letter-spacing: 2px; color: var(--red);
      text-transform: uppercase; min-height: 18px;
      margin-bottom: 14px; position: relative; z-index: 2;
    }

    #highscore-display {
      font-family: 'Rajdhani', sans-serif; font-size: 13px;
      font-weight: 600; letter-spacing: 2px; color: var(--grey);
      text-transform: uppercase; margin-bottom: 34px;
      min-height: 18px; position: relative; z-index: 2; text-align: center;
    }
    #highscore-display .hs-name  { color: var(--white); }
    #highscore-display .hs-level { color: var(--red); }
    #highscore-display .hs-hints { color: var(--grey); font-size: 11px; display: block; margin-top: 2px; }

    #screen-home { justify-content: center; }
    .home-bg {
      position: absolute; inset: 0;
      background-image: url('Home_Page_Background.png');
      background-size: cover; background-position: top center; z-index: 0;
    }
    .home-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom,
        rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.62) 55%, rgba(0,0,0,0.96) 100%);
      z-index: 1;
    }
    .home-content { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; }

    #screen-mode { background: var(--black); }
    .mode-subtitle {
      font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 600;
      letter-spacing: 3px; color: var(--grey); text-transform: uppercase;
      margin-bottom: 48px; position: relative; z-index: 2;
    }

    #screen-game {
      background: var(--black); padding: 0;
      overflow: hidden; align-items: stretch; justify-content: stretch;
    }

    @keyframes shake {
      0%   { transform: translate(0,0); }
      15%  { transform: translate(-6px, 4px); }
      30%  { transform: translate(5px,-5px); }
      45%  { transform: translate(-4px, 6px); }
      60%  { transform: translate(6px,-3px); }
      75%  { transform: translate(-3px, 4px); }
      90%  { transform: translate(4px,-2px); }
      100% { transform: translate(0,0); }
    }

    #c { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    #c.shaking { animation: shake 0.35s ease; }

    #game-hud {
      position: absolute; top: 20px; right: 28px;
      z-index: 10; text-align: right;
    }
    #game-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 22px;
      letter-spacing: 4px; color: rgba(255,255,255,0.4); margin-bottom: 2px;
    }
    #hud {
      font-family: 'Bebas Neue', sans-serif; font-size: 18px;
      letter-spacing: 3px; color: var(--white);
    }
    #form-badge {
      font-family: 'Bebas Neue', sans-serif; font-size: 13px;
      letter-spacing: 3px; color: var(--black);
      background: var(--red); padding: 3px 10px;
      margin-top: 6px; display: inline-block;
    }
    #modifier-badges {
      margin-top: 6px;
      display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
    }
    .mod-badge {
      font-family: 'Bebas Neue', sans-serif; font-size: 11px;
      letter-spacing: 2px; padding: 2px 8px; display: inline-block;
    }
    .mod-badge.wall-badge  { background: rgba(255,165,0,0.25); color: orange; border: 1px solid orange; }
    .mod-badge.flip-badge  { background: rgba(0,200,255,0.15); color: #0cf;   border: 1px solid #0cf; }
    .mod-badge.laser-badge { background: rgba(255,255,0,0.15);  color: yellow; border: 1px solid yellow; }

    /* Hint button */
    #hint-btn {
      position: absolute; top: 60px; left: 28px; z-index: 10;
      font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 3px;
      color: var(--black); background: #ffe44d; border: none; padding: 5px 14px;
      transition: opacity 0.2s, background 0.2s; cursor: none;
    }
    #hint-btn:hover { background: #ffd000; }
    #hint-btn.used  { opacity: 0.35; background: #666; color: #aaa; }

    #hint-popup {
      position: absolute; top: 100px; left: 28px; z-index: 20;
      background: rgba(0,0,0,0.9); border: 1px solid #ffe44d;
      padding: 14px 20px; max-width: 340px; display: none;
    }
    #hint-popup.visible { display: block; }
    #hint-popup .hint-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 16px;
      letter-spacing: 3px; color: #ffe44d; margin-bottom: 6px;
    }
    #hint-popup .hint-body {
      font-family: 'Rajdhani', sans-serif; font-size: 15px;
      font-weight: 600; letter-spacing: 1px; color: var(--white);
      line-height: 1.6; white-space: pre-line;
    }
    #hint-popup .hint-close {
      margin-top: 10px;
      font-family: 'Bebas Neue', sans-serif; font-size: 13px;
      letter-spacing: 3px; color: #ffe44d; background: none;
      border: 1px solid #ffe44d; padding: 3px 12px; cursor: none;
    }

    #game-controls {
      position: absolute; bottom: 24px; left: 50%;
      transform: translateX(-50%); z-index: 10;
      display: flex; align-items: center; gap: 10px;
      background: rgba(0,0,0,0.72);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 14px 20px; backdrop-filter: blur(6px); white-space: nowrap;
    }
    #game-controls .label {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px;
      letter-spacing: 2px; color: var(--white);
    }
    #game-controls .fixed {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px;
      letter-spacing: 2px; color: rgba(255,255,255,0.4);
    }
    #game-controls input {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px;
      letter-spacing: 2px; width: 65px; padding: 4px 8px;
      border: 1px solid rgba(255,255,255,0.25); border-radius: 3px;
      background: rgba(255,255,255,0.07); color: var(--white);
      outline: none; text-align: center;
      transition: border-color 0.2s; cursor: none;
    }
    #game-controls input:focus { border-color: var(--red); }
    #game-controls button {
      font-family: 'Bebas Neue', sans-serif; font-size: 18px;
      letter-spacing: 3px; padding: 6px 20px; cursor: none;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.07); color: var(--white);
      transition: background 0.2s, border-color 0.2s;
    }
    #game-controls button:hover           { background: var(--red); border-color: var(--red); }
    #game-controls button.shoot-btn       { background: var(--red); border-color: var(--red); }
    #game-controls button.shoot-btn:hover { background: #ff3a3a; }
    #game-controls button.laser-btn {
      background: rgba(255,220,0,0.12); border-color: gold; color: gold;
    }
    #game-controls button.laser-btn:hover { background: rgba(255,220,0,0.28); }
    #game-controls button.laser-cancel-btn {
      background: rgba(255,60,60,0.15); border-color: #f44; color: #f44;
    }
    #game-controls button.laser-cancel-btn:hover { background: rgba(255,60,60,0.3); }

    /* Auto-b display in laser mode */
    #game-controls .laser-b-auto {
      font-family: 'Bebas Neue', sans-serif; font-size: 18px;
      letter-spacing: 2px; color: #ffe44d; min-width: 72px;
    }

    #dot-preview {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4px; margin-right: 4px;
      border-right: 1px solid rgba(255,255,255,0.1);
      padding-right: 14px;
    }
    #dot-preview .dot-row { display: flex; align-items: center; gap: 6px; }
    #dot-preview .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    #dot-preview .dot.player { background: #0cc; }
    #dot-preview .dot.enemy  { background: #e44; }
    #dot-preview .dot-label {
      font-family: 'Bebas Neue', sans-serif; font-size: 12px;
      letter-spacing: 1px; color: rgba(255,255,255,0.5);
    }

    #msg {
      position: absolute; bottom: 90px; left: 50%;
      transform: translateX(-50%); z-index: 10;
      font-family: 'Bebas Neue', sans-serif; font-size: 22px;
      letter-spacing: 4px; color: var(--red); min-height: 28px;
      white-space: nowrap;
    }

  </style>
</head>
<body>

  <!-- CUSTOM CURSOR -->
  <svg id="custom-cursor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
    <circle cx="10" cy="10" r="8" fill="none" stroke="#e02020" stroke-width="1.5" opacity="0.85"/>
    <line x1="10" y1="1"  x2="10" y2="6"  stroke="#e02020" stroke-width="1.5"/>
    <line x1="10" y1="14" x2="10" y2="19" stroke="#e02020" stroke-width="1.5"/>
    <line x1="1"  y1="10" x2="6"  y2="10" stroke="#e02020" stroke-width="1.5"/>
    <line x1="14" y1="10" x2="19" y2="10" stroke="#e02020" stroke-width="1.5"/>
    <circle cx="10" cy="10" r="1.5" fill="#e02020"/>
  </svg>

  <!-- SCREEN 1 — INTRO -->
  <div id="screen-intro" class="screen active">
    <div class="grid-bg"></div>
    <video id="video-opening" muted playsinline preload="auto" src="Opening Scene.mp4"
           style="position:relative;z-index:1;width:min(500px,80vw);height:min(500px,80vw);object-fit:contain;display:block;"></video>
    <video id="video-loading" muted playsinline preload="auto" src="Loading screen (1).mp4"
           style="position:relative;z-index:1;width:min(500px,80vw);height:min(500px,80vw);object-fit:contain;display:none;"></video>
  </div>

  <!-- SCREEN 2 — HOME -->
  <div id="screen-home" class="screen">
    <div class="home-bg"></div>
    <div class="home-overlay"></div>
    <div class="grid-bg" style="z-index:2;"></div>
    <div class="home-content">
      <div class="logo">Math&nbsp;Att<span class="star">✦</span>que</div>
      <div class="logo-underline"></div>
      <div class="username-row">
        <label for="username-input">Player:</label>
        <input id="username-input" type="text" placeholder="Enter username" maxlength="20"
               onkeydown="if(event.key==='Enter') tryPlay()">
      </div>
      <div id="username-error"></div>
      <div id="highscore-display"></div>
      <nav class="menu">
        <button class="btn primary" onclick="tryPlay()"><span>Play</span></button>
      </nav>
    </div>
  </div>

  <!-- SCREEN 3 — MODE SELECT -->
  <div id="screen-mode" class="screen">
    <div class="grid-bg"></div>
    <button class="back-btn" onclick="goTo('screen-home')">← Back</button>
    <div class="logo" style="font-size:clamp(32px,5vw,58px); margin-bottom:4px;">Select Mode</div>
    <div class="logo-underline" style="margin-bottom:10px;"></div>
    <p class="mode-subtitle">Choose your battlefield</p>
    <nav class="menu">
      <button class="btn primary" onclick="goTo('screen-game'); startGame();"><span>PvE</span></button>
      <button class="btn disabled" disabled><span>PvP</span></button>
      <p class="coming-soon">Coming Soon</p>
      <button class="btn disabled" disabled><span>Sandbox</span></button>
      <p class="coming-soon">Coming Soon</p>
    </nav>
  </div>

  <!-- SCREEN 4 — GAME -->
  <div id="screen-game" class="screen">
    <canvas id="c"></canvas>
    <button class="back-btn" onclick="returnToHome()">← Back</button>
    <button id="hint-btn" onclick="useHint()">💡 Hint</button>
    <div id="hint-popup">
      <div class="hint-title">Hint</div>
      <div class="hint-body" id="hint-body"></div>
      <button class="hint-close" onclick="closeHint()">Close</button>
    </div>
    <div id="game-hud">
      <div id="game-title">Math Att✦que — PvE</div>
      <div id="hud"></div>
      <div id="form-badge"></div>
      <div id="modifier-badges"></div>
    </div>
    <div id="msg"></div>
    <div id="game-controls"></div>
  </div>

  <script>

    // ── CUSTOM CURSOR ────────────────────────────────────────────
    var cursorEl = document.getElementById("custom-cursor");
    document.addEventListener("mousemove", function(e) {
      cursorEl.style.left = e.clientX + "px";
      cursorEl.style.top  = e.clientY + "px";
    });

    // ── CAMERA SHAKE ─────────────────────────────────────────────
    function triggerShake() {
      var c = document.getElementById("c");
      c.classList.remove("shaking");
      void c.offsetWidth;
      c.classList.add("shaking");
      setTimeout(function() { c.classList.remove("shaking"); }, 350);
    }

    // ── SCREEN NAV ───────────────────────────────────────────────
    function goTo(screenId) {
      document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
      document.getElementById(screenId).classList.add("active");
    }
    function returnToHome() { saveHighScore(); goTo("screen-home"); }

    // ── USERNAME ─────────────────────────────────────────────────
    function tryPlay() {
      var username = document.getElementById("username-input").value.trim();
      var errEl    = document.getElementById("username-error");
      if (username === "") {
        errEl.textContent = "⚠ Enter a username to continue";
        var inp = document.getElementById("username-input");
        inp.style.borderBottomColor = "#e02020";
        setTimeout(function(){ inp.style.borderBottomColor = ""; }, 1200);
        return;
      }
      errEl.textContent = "";
      goTo("screen-mode");
    }

    // ── HIGH SCORE ───────────────────────────────────────────────
    var highScore      = { name: "", level: 0, hints: 0 };
    var hintsUsedTotal = 0;

    function saveHighScore() {
      var username = document.getElementById("username-input").value.trim() || "Anonymous";
      if (level > highScore.level) {
        highScore.name  = username;
        highScore.level = level;
        highScore.hints = hintsUsedTotal;
      }
      showHighScore();
    }
    function showHighScore() {
      var d = document.getElementById("highscore-display");
      if (highScore.level === 0) { d.textContent = ""; return; }
      d.innerHTML =
        "Best: <span class='hs-name'>" + highScore.name + "</span>" +
        " — Level <span class='hs-level'>" + highScore.level + "</span>" +
        "<span class='hs-hints'>Hints used: " + highScore.hints + "</span>";
    }

    // ── HINT SYSTEM ──────────────────────────────────────────────
    var hintUsedThisLevel = false;

    function useHint() {
      if (hintUsedThisLevel || isShooting) { return; }
      hintUsedThisLevel = true;
      hintsUsedTotal++;
      var btn = document.getElementById("hint-btn");
      btn.classList.add("used");
      btn.textContent = "💡 Used";

      var dx = enemyX - playerX;
      var dy = enemyY - playerY;
      var hintText = "";

      if (currentForm === "general") {
        var aHint = flippedParabola ? 0.2 : -0.2;
        var bHint = (dy - aHint * dx * dx) / dx;
        hintText = "Try a = " + aHint + "\nHint: b ≈ " + bHint.toFixed(2);
      } else if (currentForm === "factored") {
        hintText = "y = " + fixedA + "(x − r)(x − s)\nTry r = 0\nEnemy is " + dx.toFixed(1) + " units away.";
      } else if (currentForm === "vertex") {
        var aV = fixedA;
        var bV = (dy - aV * dx * dx) / dx;
        var hV = (-bV / (2 * aV)).toFixed(2);
        hintText = "y = " + fixedA + "(x − h)² + k\nHint: h ≈ " + hV + "\nAdjust k for height.";
      }

      document.getElementById("hint-body").textContent = hintText;
      document.getElementById("hint-popup").classList.add("visible");
    }
    function closeHint() {
      document.getElementById("hint-popup").classList.remove("visible");
    }

    // ── INTRO VIDEOS ─────────────────────────────────────────────
    var videoOpening = document.getElementById("video-opening");
    var videoLoading = document.getElementById("video-loading");
    function playOpeningVideo() {
      videoOpening.style.display = "block"; videoLoading.style.display = "none";
      var fb = setTimeout(playLoadingVideo, 6000);
      videoOpening.addEventListener("ended", function(){ clearTimeout(fb); playLoadingVideo(); });
      videoOpening.addEventListener("error",  function(){ clearTimeout(fb); playLoadingVideo(); });
      videoOpening.play().catch(function(){ clearTimeout(fb); playLoadingVideo(); });
    }
    function playLoadingVideo() {
      videoOpening.style.display = "none"; videoLoading.style.display = "block";
      var fb = setTimeout(function(){ goTo("screen-home"); }, 7000);
      videoLoading.addEventListener("ended", function(){ clearTimeout(fb); goTo("screen-home"); });
      videoLoading.addEventListener("error",  function(){ clearTimeout(fb); goTo("screen-home"); });
      videoLoading.play().catch(function(){ clearTimeout(fb); goTo("screen-home"); });
    }
    playOpeningVideo();

    // ── CANVAS ───────────────────────────────────────────────────
    var canvas = document.getElementById("c");
    var ctx    = canvas.getContext("2d");
    var GRID_COLS = 16, GRID_ROWS = 10;
    var CANVAS_WIDTH, CANVAS_HEIGHT, CELL_WIDTH, CELL_HEIGHT;

    function resizeCanvas() {
      CANVAS_WIDTH  = window.innerWidth;
      CANVAS_HEIGHT = window.innerHeight;
      CELL_WIDTH    = CANVAS_WIDTH  / GRID_COLS;
      CELL_HEIGHT   = CANVAS_HEIGHT / GRID_ROWS;
      canvas.width  = CANVAS_WIDTH;
      canvas.height = CANVAS_HEIGHT;
    }
    window.addEventListener("resize", function(){
      resizeCanvas();
      if (typeof playerX !== "undefined") draw();
    });

    function gridToPixel(gx, gy) {
      return { px: gx * CELL_WIDTH, py: CANVAS_HEIGHT - gy * CELL_HEIGHT };
    }
    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // ── OFF-SCREEN TRACKER ───────────────────────────────────────
    var trackerPos = null;
    function drawTracker() {
      if (!trackerPos || trackerPos.py >= 0) { return; }
      var ax = Math.max(30, Math.min(CANVAS_WIDTH - 30, trackerPos.px));
      var ay = 16, aw = 10, ah = 13;
      ctx.save();
      ctx.strokeStyle = "rgba(255,220,0,0.9)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(ax, ay + ah + 2); ctx.lineTo(ax, ay + ah + 12); ctx.stroke();
      ctx.fillStyle = "rgba(255,220,0,0.9)";
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax - aw, ay + ah); ctx.lineTo(ax + aw, ay + ah); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(255,220,0,0.85)"; ctx.font = "11px monospace"; ctx.textAlign = "center";
      ctx.fillText("x=" + trackerPos.worldX.toFixed(1), ax, ay + ah + 24);
      ctx.fillText("y=" + trackerPos.worldY.toFixed(1), ax, ay + ah + 36);
      ctx.restore();
    }

    // ── MODIFIERS ────────────────────────────────────────────────
    var hasWalls       = false;
    var flippedParabola = false;
    var walls          = [];

    function rollModifiers(lvl) {
      hasWalls = (lvl >= 7) && (Math.random() < 0.25);
      flippedParabola = !hasWalls && (lvl >= 10) && (Math.random() < 0.20);
    }

    function buildWalls() {
      walls = [];
      if (!hasWalls) { return; }
      var numWalls = Math.random() < 0.4 ? 2 : 1;
      var left  = playerX + 2;
      var right = enemyX  - 2;
      if (right - left < 2) { return; }
      for (var w = 0; w < numWalls; w++) {
        var attempts = 0, wallCol;
        do {
          wallCol = left + Math.floor(Math.random() * (right - left + 1));
          attempts++;
        } while (isWallAt(wallCol) && attempts < 20);
        if (isWallAt(wallCol)) { continue; }
        walls.push({ gridX: wallCol, topGridY: 2 + Math.floor(Math.random() * 4) });
      }
    }

    function isWallAt(gridX) {
      for (var i = 0; i < walls.length; i++) { if (walls[i].gridX === gridX) { return true; } }
      return false;
    }

    function isBlockedByWall(worldX, worldY) {
      for (var i = 0; i < walls.length; i++) {
        var w = walls[i];
        if (Math.abs(worldX - w.gridX) < 0.6 && worldY <= w.topGridY) { return true; }
      }
      return false;
    }

    // ── LASER ────────────────────────────────────────────────────
    var laserCharges = 0;
    var laserArmed   = false;

    function checkLaserReward() {
      if (level % 5 === 0) {
        laserCharges++;
        setMessage("⚡ Laser charge earned! (" + laserCharges + " charge" + (laserCharges > 1 ? "s" : "") + ")");
      }
    }

    function activateLaser() {
      if (laserCharges <= 0 || isShooting) { return; }
      laserArmed = true;
      renderControls();
      setMessage("⚡ Laser armed — enter slope m. Line always starts from your dot.");
    }

    function cancelLaser() {
      laserArmed = false;
      renderControls();
      setMessage("");
    }

    // ── EQUATION FORMS ───────────────────────────────────────────
    var FORM_ORDER      = ["general", "factored", "vertex"];
    var FIXED_A_OPTIONS = [-0.1, -0.15, -0.2, -0.25, -0.3];
    var currentForm, fixedA;

    function pickForm(lvl) {
      currentForm = FORM_ORDER[(lvl - 1) % FORM_ORDER.length];
      if (flippedParabola) {
        var posOpts = [0.1, 0.15, 0.2, 0.25, 0.3];
        fixedA = posOpts[Math.floor(Math.random() * posOpts.length)];
      } else {
        fixedA = FIXED_A_OPTIONS[Math.floor(Math.random() * FIXED_A_OPTIONS.length)];
      }
    }

    // ── DOT PREVIEW ──────────────────────────────────────────────
    function dotPreviewHTML() {
      return (
        "<div id='dot-preview'>" +
          "<div class='dot-row'><div class='dot player'></div>" +
          "<span class='dot-label'>You (" + playerX + "," + playerY + ")</span></div>" +
          "<div class='dot-row'><div class='dot enemy'></div>" +
          "<span class='dot-label'>Enemy (" + enemyX + "," + enemyY + ")</span></div>" +
        "</div>"
      );
    }

    // ── RENDER CONTROLS ──────────────────────────────────────────
    function renderControls() {
      var bar   = document.getElementById("game-controls");
      var badge = document.getElementById("form-badge");

      var laserToggleBtn = "";
      if (laserArmed) {
        laserToggleBtn = "<button class='laser-cancel-btn' onclick='cancelLaser()'>✕ Cancel Laser</button>";
      } else if (laserCharges > 0) {
        laserToggleBtn = "<button class='laser-btn' onclick='activateLaser()'>⚡ Laser (" + laserCharges + ")</button>";
      }

      // ── LASER MODE ───────────────────────────────────────────
      // The laser always passes through (playerX, playerY).
      // Standard form: y = m*(x - playerX) + playerY
      // which equals:  y = m*x + (playerY - m*playerX)
      // Player only needs to enter m; b is computed automatically.
      if (laserArmed) {
        badge.textContent = "⚡ Laser — Linear (through your dot)";
        badge.style.background = "#cc9900"; badge.style.color = "#000";
        bar.innerHTML =
          dotPreviewHTML() +
          "<span class='label'>slope m =</span>" +
          "<input id='inputM' placeholder='m' style='width:60px'>" +
          "<span class='label' style='font-size:13px;color:rgba(255,255,255,0.45);'>" +
            "→ y = m(x−" + playerX + ")+" + playerY +
          "</span>" +
          laserToggleBtn +
          "<button class='shoot-btn' onclick='shoot()'>Fire!</button>";

        // Live preview of b value in the formula display
        setTimeout(function() {
          var mInput = document.getElementById("inputM");
          if (!mInput) { return; }
          mInput.addEventListener("input", function() {
            var m = parseFloat(mInput.value);
            var labelEl = bar.querySelector(".label[style]");
            if (!labelEl) { return; }
            if (!isNaN(m)) {
              var b = playerY - m * playerX;
              labelEl.textContent = "→ y = " + m + "x + " + b.toFixed(2) + "  (passes through dot ✓)";
              labelEl.style.color = "#ffe44d";
            } else {
              labelEl.textContent = "→ y = m(x−" + playerX + ")+" + playerY;
              labelEl.style.color = "rgba(255,255,255,0.45)";
            }
          });
        }, 0);
        return;
      }

      badge.style.background = ""; badge.style.color = "";

      if (currentForm === "general") {
        badge.textContent = flippedParabola ? "General Form ↑ (a > 0)" : "General Form";
        bar.innerHTML =
          dotPreviewHTML() +
          "<span class='label'>y =</span>" +
          "<input id='inputA' placeholder='a'>" +
          "<span class='label'>x² +</span>" +
          "<input id='inputB' placeholder='b'>" +
          "<span class='label'>x</span>" +
          laserToggleBtn +
          "<button class='shoot-btn' onclick='shoot()'>Shoot</button>";

      } else if (currentForm === "factored") {
        badge.textContent = flippedParabola ? "Factored Form ↑" : "Factored Form";
        bar.innerHTML =
          dotPreviewHTML() +
          "<span class='label'>y =</span>" +
          "<span class='fixed'>" + fixedA + "</span>" +
          "<span class='label'>(x −</span>" +
          "<input id='inputR' placeholder='r'>" +
          "<span class='label'>)(x −</span>" +
          "<input id='inputS' placeholder='s'>" +
          "<span class='label'>)</span>" +
          laserToggleBtn +
          "<button class='shoot-btn' onclick='shoot()'>Shoot</button>";

      } else if (currentForm === "vertex") {
        badge.textContent = flippedParabola ? "Vertex Form ↑" : "Vertex Form";
        bar.innerHTML =
          dotPreviewHTML() +
          "<span class='label'>y =</span>" +
          "<span class='fixed'>" + fixedA + "</span>" +
          "<span class='label'>(x −</span>" +
          "<input id='inputH' placeholder='h'>" +
          "<span class='label'>)² +</span>" +
          "<input id='inputK' placeholder='k'>" +
          laserToggleBtn +
          "<button class='shoot-btn' onclick='shoot()'>Shoot</button>";
      }
    }

    // ── READ INPUTS ──────────────────────────────────────────────
    function readInputs() {
      if (laserArmed) {
        var m = parseFloat(document.getElementById("inputM").value);
        if (isNaN(m)) { setMessage("Enter a slope m for the laser."); return null; }
        // Compute b so line always passes through (playerX, playerY)
        var bAuto = playerY - m * playerX;
        return { isLaser: true, m: m, bAuto: bAuto };
      }

      if (currentForm === "general") {
        var a = parseFloat(document.getElementById("inputA").value);
        var b = parseFloat(document.getElementById("inputB").value);
        if (isNaN(a) || isNaN(b))           { setMessage("Enter values for a and b."); return null; }
        if (Math.abs(a) < 0.05)             { setMessage("a is too small. Try ±0.2");  return null; }
        if (flippedParabola  && a < 0) { a = -a; }
        if (!flippedParabola && a > 0) { a = -a; }
        return { a: a, b: b };

      } else if (currentForm === "factored") {
        var r = parseFloat(document.getElementById("inputR").value);
        var s = parseFloat(document.getElementById("inputS").value);
        if (isNaN(r) || isNaN(s)) { setMessage("Enter values for r and s."); return null; }
        return { a: fixedA, b: -fixedA * (r + s) };

      } else if (currentForm === "vertex") {
        var h = parseFloat(document.getElementById("inputH").value);
        var k = parseFloat(document.getElementById("inputK").value);
        if (isNaN(h) || isNaN(k)) { setMessage("Enter values for h and k."); return null; }
        return { a: fixedA, b: -2 * fixedA * h };
      }
      return null;
    }

    function getAnswer() {
      var dx = enemyX - playerX;
      var dy = enemyY - playerY;
      if (currentForm === "general") {
        var a = flippedParabola ? 0.2 : -0.2;
        var b = (dy - a * dx * dx) / dx;
        return "a=" + a.toFixed(2) + " b=" + b.toFixed(2);
      }
      if (currentForm === "factored") { return "r=0  s=" + dx.toFixed(2); }
      if (currentForm === "vertex") {
        var aH = fixedA, bH = (dy - aH * dx * dx) / dx;
        return "h=" + (-bH / (2 * aH)).toFixed(2) + "  (test k)";
      }
      return "";
    }

    function getBarrelAngle(a, b) {
      return Math.atan2(-b * CELL_HEIGHT, CELL_WIDTH);
    }

    // ── GAME STATE ───────────────────────────────────────────────
    var level, shotsLeft;
    var playerX, playerY, enemyX, enemyY;
    var lastAB    = null;
    var pastShots = [], isShooting = false, particles = [];

    function placeDots() {
      playerX = randomInt(1, 3);  playerY = randomInt(2, 6);
      enemyX  = randomInt(12,15); enemyY  = randomInt(2, 6);
    }

    // ── EXPLOSION ─────────────────────────────────────────────────
    function spawnExplosion(px, py) {
      particles = [];
      for (var i = 0; i < 16; i++) {
        var angle = (i / 16) * Math.PI * 2, speed = 3 + Math.random() * 4;
        particles.push({ x: px, y: py,
          vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
          life: 1.0, radius: 4 + Math.random()*4 });
      }
    }
    function drawAndUpdateParticles() {
      var anyAlive = false;
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        if (p.life <= 0) { continue; }
        p.x += p.vx; p.y += p.vy; p.life -= 0.035;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
        ctx.fillStyle = "rgba(255,140,0," + p.life + ")"; ctx.fill();
        anyAlive = true;
      }
      return anyAlive;
    }
    function animateExplosion(done) {
      draw();
      var still = drawAndUpdateParticles();
      if (still) { requestAnimationFrame(function(){ animateExplosion(done); }); }
      else        { setTimeout(done, 200); }
    }

    // ── DRAW HELPERS ──────────────────────────────────────────────
    function drawDotWithBarrel(px, py, dotR, color, angle, bLen, bW) {
      ctx.save();
      ctx.translate(px, py); ctx.rotate(angle);
      ctx.fillStyle = color;
      ctx.fillRect(dotR - 2, -bW / 2, bLen, bW);
      ctx.restore();
      ctx.beginPath(); ctx.arc(px, py, dotR, 0, Math.PI*2);
      ctx.fillStyle = color; ctx.fill();
    }

    function drawWalls() {
      for (var i = 0; i < walls.length; i++) {
        var w   = walls[i];
        var top = gridToPixel(w.gridX, w.topGridY);
        var bot = gridToPixel(w.gridX, 0);
        var wx  = w.gridX * CELL_WIDTH - CELL_WIDTH * 0.15;
        var ww  = CELL_WIDTH * 0.3;
        ctx.fillStyle   = "rgba(255,140,0,0.25)";
        ctx.fillRect(wx, top.py, ww, bot.py - top.py);
        ctx.strokeStyle = "orange"; ctx.lineWidth = 2;
        ctx.strokeRect(wx, top.py, ww, bot.py - top.py);
        ctx.fillStyle = "orange";
        ctx.fillRect(wx, top.py, ww, 4);
        ctx.fillStyle = "rgba(255,165,0,0.8)";
        ctx.font = Math.floor(CELL_HEIGHT * 0.18) + "px monospace";
        ctx.textAlign = "center";
        ctx.fillText("y≤" + w.topGridY, w.gridX * CELL_WIDTH, top.py - 6);
      }
    }

    function updateModifierBadges() {
      var c = document.getElementById("modifier-badges");
      c.innerHTML = "";
      if (walls.length > 0) {
        var wb = document.createElement("div"); wb.className = "mod-badge wall-badge";
        wb.textContent = "⚠ Walls Active"; c.appendChild(wb);
      }
      if (flippedParabola) {
        var fb = document.createElement("div"); fb.className = "mod-badge flip-badge";
        fb.textContent = "↑ Flipped (a > 0)"; c.appendChild(fb);
      }
      if (laserCharges > 0) {
        var lb = document.createElement("div"); lb.className = "mod-badge laser-badge";
        lb.textContent = "⚡ Laser ×" + laserCharges; c.appendChild(lb);
      }
    }

    // ── MAIN DRAW ─────────────────────────────────────────────────
    function draw() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // Grid
      ctx.strokeStyle = "rgba(255,255,255,0.1)"; ctx.lineWidth = 1;
      for (var col = 0; col <= GRID_COLS; col++) {
        ctx.beginPath(); ctx.moveTo(col*CELL_WIDTH,0); ctx.lineTo(col*CELL_WIDTH,CANVAS_HEIGHT); ctx.stroke();
      }
      for (var row = 0; row <= GRID_ROWS; row++) {
        ctx.beginPath(); ctx.moveTo(0,row*CELL_HEIGHT); ctx.lineTo(CANVAS_WIDTH,row*CELL_HEIGHT); ctx.stroke();
      }

      // Axis numbers
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.font = Math.floor(CELL_HEIGHT * 0.2) + "px monospace"; ctx.textAlign = "left";
      for (var i = 1; i <= GRID_COLS; i++) { ctx.fillText(i, i*CELL_WIDTH+4, CANVAS_HEIGHT-6); }
      for (var j = 1; j <= GRID_ROWS;  j++) { ctx.fillText(j, 4, CANVAS_HEIGHT-j*CELL_HEIGHT-4); }

      drawWalls();

      // Past shots — brighter and thicker
      for (var s = 0; s < pastShots.length; s++) {
        var shot = pastShots[s];
        if (shot.length < 2) { continue; }
        var isLaserShot = shot.isLaser || false;

        ctx.save();
        if (isLaserShot) {
          ctx.strokeStyle = "rgba(255,230,0,0.45)";
          ctx.lineWidth   = 2.5;
          ctx.shadowColor = "rgba(255,220,0,0.5)";
          ctx.shadowBlur  = 6;
        } else {
          ctx.strokeStyle = "rgba(160,210,255,0.55)";
          ctx.lineWidth   = 2.5;
          ctx.shadowColor = "rgba(100,180,255,0.6)";
          ctx.shadowBlur  = 8;
        }
        ctx.beginPath();
        ctx.moveTo(shot[0].px, shot[0].py);
        for (var p = 1; p < shot.length; p++) { ctx.lineTo(shot[p].px, shot[p].py); }
        ctx.stroke();
        ctx.restore();
      }

      // Player dot + barrel
      var player = gridToPixel(playerX, playerY);
      var dotR   = Math.max(7, Math.min(CELL_WIDTH, CELL_HEIGHT) * 0.18);
      var barrelAngle = lastAB ? getBarrelAngle(lastAB.a, lastAB.b) : 0;
      drawDotWithBarrel(player.px, player.py, dotR, "#0cc", barrelAngle, dotR*2.2, dotR*0.7);
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.font = Math.floor(CELL_HEIGHT*0.18)+"px monospace"; ctx.textAlign = "left";
      ctx.fillText("("+playerX+","+playerY+")", player.px+dotR+6, player.py-7);

      // Enemy dot
      var enemy = gridToPixel(enemyX, enemyY);
      ctx.beginPath(); ctx.arc(enemy.px, enemy.py, dotR, 0, Math.PI*2);
      ctx.fillStyle = "#e44"; ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.fillText("("+enemyX+","+enemyY+")", enemy.px+dotR+6, enemy.py-7);

      drawTracker();
    }

    // ── SHOOT ─────────────────────────────────────────────────────
    function shoot() {
      if (isShooting) { return; }
      if (shotsLeft <= 0) { setMessage("No shots left!"); return; }
      closeHint();

      var inputs = readInputs();
      if (inputs === null) { return; }

      isShooting = true;
      setMessage("");

      if (inputs.isLaser) {
        laserCharges--;
        laserArmed = false;
        updateModifierBadges();
        shootLaser(inputs.m, inputs.bAuto);
        return;
      }

      var a = inputs.a, b = inputs.b;
      lastAB = { a: a, b: b };

      var path = [], t = 0;

      function step() {
        var worldX = playerX + t;
        var worldY = playerY + (a * t * t + b * t);
        var pos    = gridToPixel(worldX, worldY);

        if (worldX > enemyX + 1 || worldY < 0) {
          trackerPos = null; finishShot(path, false, pos.px, pos.py, "oob", false); return;
        }

        trackerPos = { px: pos.px, py: pos.py, worldX: worldX, worldY: worldY };

        var onScreen = (pos.py >= 0 && pos.py <= CANVAS_HEIGHT && pos.px >= 0 && pos.px <= CANVAS_WIDTH);
        if (onScreen) { path.push({ px: pos.px, py: pos.py }); }

        draw();

        if (onScreen && path.length > 0) {
          // Glow layer
          ctx.save();
          ctx.beginPath();
          ctx.strokeStyle = flippedParabola ? "rgba(0,220,255,0.35)" : "rgba(100,180,255,0.35)";
          ctx.lineWidth = 6;
          ctx.shadowColor = flippedParabola ? "#0cf" : "#88aaff";
          ctx.shadowBlur = 14;
          for (var i = 0; i < path.length; i++) {
            if (i === 0) { ctx.moveTo(path[i].px, path[i].py); }
            else         { ctx.lineTo(path[i].px, path[i].py); }
          }
          ctx.stroke();
          ctx.restore();

          // Bright core line
          ctx.save();
          ctx.beginPath();
          ctx.strokeStyle = flippedParabola ? "rgba(0,240,255,0.95)" : "rgba(200,230,255,0.95)";
          ctx.lineWidth = 2.5;
          for (var i = 0; i < path.length; i++) {
            if (i === 0) { ctx.moveTo(path[i].px, path[i].py); }
            else         { ctx.lineTo(path[i].px, path[i].py); }
          }
          ctx.stroke();
          ctx.restore();

          // Bullet dot
          ctx.beginPath(); ctx.arc(pos.px, pos.py, 5, 0, Math.PI*2);
          ctx.fillStyle = flippedParabola ? "#0ff" : "#cce8ff"; ctx.fill();
        }

        if (isBlockedByWall(worldX, worldY)) { trackerPos = null; finishShot(path, false, pos.px, pos.py, "wall", false); return; }
        if (isNearEnemy(pos.px, pos.py))      { trackerPos = null; finishShot(path, true,  pos.px, pos.py, "hit",  false); return; }

        t += 0.05;
        requestAnimationFrame(step);
      }

      step();
    }

    // ── LASER SHOT ───────────────────────────────────────────────
    // bAuto = playerY - m * playerX, so y = m*worldX + bAuto
    // At worldX = playerX: y = m*playerX + (playerY - m*playerX) = playerY ✓
    function shootLaser(m, bAuto) {
      lastAB = { a: 0, b: m };  // barrel points at slope m

      var path = [], t = 0;
      path.isLaser = true;  // tag for past-shot rendering

      function stepLaser() {
        var worldX = playerX + t;
        // y = m * worldX + bAuto  (always passes through player dot)
        var worldY = m * worldX + bAuto;
        var pos    = gridToPixel(worldX, worldY);

        if (worldX > enemyX + 1 || worldY < 0) {
          trackerPos = null; finishShot(path, false, pos.px, pos.py, "oob", true); return;
        }

        trackerPos = { px: pos.px, py: pos.py, worldX: worldX, worldY: worldY };

        var onScreen = (pos.py >= 0 && pos.py <= CANVAS_HEIGHT && pos.px >= 0 && pos.px <= CANVAS_WIDTH);
        if (onScreen) { path.push({ px: pos.px, py: pos.py }); }

        draw();

        if (onScreen && path.length > 0) {
          // Glow
          ctx.save();
          ctx.beginPath();
          ctx.strokeStyle = "rgba(255,240,0,0.35)";
          ctx.lineWidth = 8;
          ctx.shadowColor = "yellow";
          ctx.shadowBlur = 20;
          for (var i = 0; i < path.length; i++) {
            if (i === 0) { ctx.moveTo(path[i].px, path[i].py); }
            else         { ctx.lineTo(path[i].px, path[i].py); }
          }
          ctx.stroke();
          ctx.restore();

          // Bright core
          ctx.save();
          ctx.beginPath();
          ctx.strokeStyle = "rgba(255,248,180,0.98)";
          ctx.lineWidth = 3;
          for (var i = 0; i < path.length; i++) {
            if (i === 0) { ctx.moveTo(path[i].px, path[i].py); }
            else         { ctx.lineTo(path[i].px, path[i].py); }
          }
          ctx.stroke();
          ctx.restore();

          ctx.beginPath(); ctx.arc(pos.px, pos.py, 4, 0, Math.PI*2);
          ctx.fillStyle = "white"; ctx.fill();
        }

        if (isBlockedByWall(worldX, worldY)) { trackerPos = null; finishShot(path, false, pos.px, pos.py, "wall", true); return; }
        if (isNearEnemy(pos.px, pos.py))      { trackerPos = null; finishShot(path, true,  pos.px, pos.py, "hit",  true); return; }

        t += 0.05;
        requestAnimationFrame(stepLaser);
      }

      stepLaser();
    }

    // ── FINISH SHOT ───────────────────────────────────────────────
    function isNearEnemy(px, py) {
      var enemy = gridToPixel(enemyX, enemyY);
      var dx = px - enemy.px, dy = py - enemy.py;
      return Math.sqrt(dx*dx + dy*dy) < 14;
    }

    function finishShot(path, didHit, hitPx, hitPy, reason, isLaser) {
      isShooting = false;
      laserArmed = false;
      trackerPos = null;
      if (isLaser) { path.isLaser = true; }
      pastShots.push(path);
      if (pastShots.length > 20) { pastShots.shift(); }
      shotsLeft--;

      if (didHit) {
        setMessage("Hit!");
        triggerShake();
        spawnExplosion(hitPx, hitPy);
        animateExplosion(function() {
          level++;
          checkLaserReward();
          shotsLeft = 5; pastShots = []; particles = []; lastAB = null;
          startLevel();
        });
      } else {
        if (reason === "wall") { setMessage("Wall blocked your shot! Arc higher."); }
        if (shotsLeft <= 0) {
          saveHighScore();
          setMessage("Out of shots!  Hint: " + getAnswer() + "  — back to menu…");
          setTimeout(function(){ goTo("screen-home"); }, 3500);
        } else {
          if (reason !== "wall") { setMessage("Miss!"); }
          updateHUD(); draw();
        }
      }
    }

    // ── HUD & MESSAGE ────────────────────────────────────────────
    function updateHUD() {
      document.getElementById("hud").textContent = "Level: " + level + "   |   Shots: " + shotsLeft;
      updateModifierBadges();
    }
    function setMessage(text) {
      document.getElementById("msg").textContent = text;
    }

    // ── START LEVEL ───────────────────────────────────────────────
    function startLevel() {
      rollModifiers(level);
      pickForm(level);
      placeDots();
      buildWalls();

      laserArmed = false;
      lastAB     = null;
      trackerPos = null;

      hintUsedThisLevel = false;
      var hintBtn = document.getElementById("hint-btn");
      if (hintBtn) { hintBtn.classList.remove("used"); hintBtn.textContent = "💡 Hint"; }
      closeHint();

      setMessage(""); updateHUD(); renderControls(); resizeCanvas(); draw();
    }

    // ── START GAME ────────────────────────────────────────────────
    function startGame() {
      level = 1; shotsLeft = 5;
      pastShots = []; particles = [];
      isShooting = false; lastAB = null;
      laserCharges = 0; laserArmed = false;
      walls = []; hasWalls = false; flippedParabola = false;
      trackerPos = null; hintsUsedTotal = 0; hintUsedThisLevel = false;
      startLevel();
    }

  </script>
</body>
</html>
