
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Math Attaque</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>

    :root {
      --red:       #e02020;
      --white:     #ffffff;
      --black:     #000000;
      --grey:      #aaaaaa;
      --grid-line: rgba(255,255,255,0.09);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    *, *::before, *::after { cursor: none !important; }

    /* ── CUSTOM CURSOR ──────────────────────────────────────── */
    #custom-cursor {
      position: fixed;
      top: 0; left: 0;
      width: 20px; height: 20px;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--black);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      color: var(--white);
    }

    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--black);
    }

    .screen.active { display: flex; }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 8vw, 96px);
      letter-spacing: 5px;
      color: var(--white);
      display: flex;
      align-items: center;
      margin-bottom: 6px;
      position: relative;
      z-index: 2;
    }

    .logo .star { color: var(--red); }

    .logo-underline {
      width: min(480px, 72vw);
      height: 2px;
      background: var(--white);
      margin-bottom: 40px;
      position: relative;
      z-index: 2;
    }

    .menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      position: relative;
      z-index: 2;
    }

    .btn {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(18px, 2.8vw, 26px);
      letter-spacing: 4px;
      color: var(--white);
      background: transparent;
      border: 2px solid rgba(255,255,255,0.25);
      padding: 13px 60px;
      min-width: 280px;
      text-align: center;
      cursor: none;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--red);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.22s ease;
      z-index: 0;
    }

    .btn:hover::before  { transform: scaleX(1); }
    .btn:hover          { border-color: var(--red); }
    .btn span           { position: relative; z-index: 1; }
    .btn.primary        { background: var(--red); border-color: var(--red); }

    .btn.disabled {
      opacity: 0.4;
      cursor: none;
      border-color: rgba(255,255,255,0.1);
    }
    .btn.disabled::before { display: none; }

    .coming-soon {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--grey);
      text-transform: uppercase;
      margin-top: -8px;
      position: relative;
      z-index: 2;
    }

    .back-btn {
      position: absolute;
      top: 24px; left: 28px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 3px;
      color: var(--grey);
      background: none;
      border: none;
      cursor: none;
      transition: color 0.2s;
      z-index: 10;
    }

    .back-btn:hover { color: var(--white); }

    /* ── USERNAME ───────────────────────────────────────────── */
    .username-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      position: relative;
      z-index: 2;
    }

    .username-row label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      color: var(--grey);
    }

    .username-row input {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      background: transparent;
      border: none;
      border-bottom: 2px solid rgba(255,255,255,0.3);
      color: var(--white);
      padding: 4px 8px;
      width: 200px;
      outline: none;
      transition: border-color 0.2s;
      cursor: none;
    }

    .username-row input::placeholder { color: rgba(255,255,255,0.2); }
    .username-row input:focus        { border-color: var(--red); }

    #username-error {
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--red);
      text-transform: uppercase;
      min-height: 18px;
      margin-bottom: 14px;
      position: relative;
      z-index: 2;
    }

    /* ── HIGH SCORE ─────────────────────────────────────────── */
    #highscore-display {
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--grey);
      text-transform: uppercase;
      margin-bottom: 34px;
      min-height: 18px;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    #highscore-display .hs-name   { color: var(--white); }
    #highscore-display .hs-level  { color: var(--red); }
    #highscore-display .hs-hints  { color: var(--grey); font-size: 11px; }

    /* ── HOME ───────────────────────────────────────────────── */
    #screen-home { justify-content: center; }

    .home-bg {
      position: absolute; inset: 0;
      background-image: url('Home_Page_Background.png');
      background-size: cover;
      background-position: top center;
      z-index: 0;
    }

    .home-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.62) 55%, rgba(0,0,0,0.96) 100%);
      z-index: 1;
    }

    .home-content {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── MODE SELECT ────────────────────────────────────────── */
    #screen-mode { background: var(--black); }

    .mode-subtitle {
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--grey);
      text-transform: uppercase;
      margin-bottom: 48px;
      position: relative;
      z-index: 2;
    }

    /* ── GAME SCREEN ────────────────────────────────────────── */
    #screen-game {
      background: var(--black);
      padding: 0;
      overflow: hidden;
      align-items: stretch;
      justify-content: stretch;
    }

    #c {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
    }

    /* ── GAME HUD ────────────────────────────────────────────── */
    #game-hud {
      position: absolute;
      top: 20px; right: 28px;
      z-index: 10;
      text-align: right;
    }

    #game-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 2px;
    }

    #hud {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      color: var(--white);
    }

    #form-badge {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--black);
      background: var(--red);
      padding: 3px 10px;
      margin-top: 6px;
      display: inline-block;
    }

    #modifier-badges {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .mod-badge {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      padding: 2px 8px;
      display: inline-block;
    }

    .mod-badge.wall-badge  { background: rgba(255,165,0,0.25); color: orange; border: 1px solid orange; }
    .mod-badge.flip-badge  { background: rgba(0,200,255,0.15); color: #0cf;   border: 1px solid #0cf; }
    .mod-badge.laser-badge { background: rgba(255,255,0,0.15);  color: yellow; border: 1px solid yellow; }

    /* ── HINT button in HUD top-left ────────────────────────── */
    #hint-btn {
      position: absolute;
      top: 20px;
      left: 80px;   /* sits right of the ← Back button */
      z-index: 10;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 15px;
      letter-spacing: 3px;
      color: var(--black);
      background: #ffe44d;
      border: none;
      padding: 5px 16px;
      transition: opacity 0.2s, background 0.2s;
    }

    #hint-btn:hover   { background: #ffd000; }
    #hint-btn.used    { opacity: 0.35; background: #666; color: #aaa; }

    /* ── HINT POPUP ─────────────────────────────────────────── */
    #hint-popup {
      position: absolute;
      top: 60px;
      left: 80px;
      z-index: 20;
      background: rgba(0,0,0,0.88);
      border: 1px solid #ffe44d;
      padding: 14px 20px;
      max-width: 340px;
      display: none;
    }

    #hint-popup.visible { display: block; }

    #hint-popup .hint-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 3px;
      color: #ffe44d;
      margin-bottom: 6px;
    }

    #hint-popup .hint-body {
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--white);
      line-height: 1.5;
    }

    #hint-popup .hint-close {
      margin-top: 10px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      color: #ffe44d;
      background: none;
      border: 1px solid #ffe44d;
      padding: 3px 12px;
    }

    /* ── CONTROLS ────────────────────────────────────────────── */
    #game-controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.72);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 14px 28px;
      backdrop-filter: blur(6px);
      white-space: nowrap;
    }

    #game-controls .label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--white);
    }

    #game-controls .fixed {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.4);
    }

    #game-controls input {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      width: 65px;
      padding: 4px 8px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 3px;
      background: rgba(255,255,255,0.07);
      color: var(--white);
      outline: none;
      text-align: center;
      transition: border-color 0.2s;
      cursor: none;
    }

    #game-controls input:focus { border-color: var(--red); }

    #game-controls button {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      padding: 6px 20px;
      cursor: none;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.07);
      color: var(--white);
      transition: background 0.2s, border-color 0.2s;
    }

    #game-controls button:hover           { background: var(--red); border-color: var(--red); }
    #game-controls button.shoot-btn       { background: var(--red); border-color: var(--red); }
    #game-controls button.shoot-btn:hover { background: #ff3a3a; }
    #game-controls button.laser-btn       { background: rgba(255,220,0,0.15); border-color: gold; color: gold; }
    #game-controls button.laser-btn:hover { background: rgba(255,220,0,0.35); }

    #msg {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 4px;
      color: var(--red);
      min-height: 28px;
      white-space: nowrap;
    }

  </style>
</head>
<body>

  <!-- CUSTOM CURSOR -->
  <svg id="custom-cursor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
    <circle cx="10" cy="10" r="8" fill="none" stroke="#e02020" stroke-width="1.5" opacity="0.85"/>
    <line x1="10" y1="1"  x2="10" y2="6"  stroke="#e02020" stroke-width="1.5"/>
    <line x1="10" y1="14" x2="10" y2="19" stroke="#e02020" stroke-width="1.5"/>
    <line x1="1"  y1="10" x2="6"  y2="10" stroke="#e02020" stroke-width="1.5"/>
    <line x1="14" y1="10" x2="19" y2="10" stroke="#e02020" stroke-width="1.5"/>
    <circle cx="10" cy="10" r="1.5" fill="#e02020"/>
  </svg>


  <!-- ============================================================
       SCREEN 1 — INTRO
       VIDEO 1 src = your opening logo path
       VIDEO 2 src = your loading screen path
  ============================================================ -->
  <div id="screen-intro" class="screen active">
    <div class="grid-bg"></div>
    <video id="video-opening" muted playsinline preload="auto" src="Opening Scene.mp4"
           style="position:relative;z-index:1;width:min(500px,80vw);height:min(500px,80vw);object-fit:contain;display:block;"></video>
    <video id="video-loading" muted playsinline preload="auto" src="Loading screen (1).mp4"
           style="position:relative;z-index:1;width:min(500px,80vw);height:min(500px,80vw);object-fit:contain;display:none;"></video>
  </div>


  <!-- ============================================================
       SCREEN 2 — HOME
  ============================================================ -->
  <div id="screen-home" class="screen">
    <div class="home-bg"></div>
    <div class="home-overlay"></div>
    <div class="grid-bg" style="z-index:2; opacity:0.5;"></div>
    <div class="home-content">
      <div class="logo">Math&nbsp;Att<span class="star">✦</span>que</div>
      <div class="logo-underline"></div>
      <div class="username-row">
        <label for="username-input">Player:</label>
        <input id="username-input" type="text" placeholder="Enter username" maxlength="20"
               onkeydown="if(event.key==='Enter') tryPlay()">
      </div>
      <div id="username-error"></div>
      <div id="highscore-display"></div>
      <nav class="menu">
        <button class="btn primary" onclick="tryPlay()"><span>Play</span></button>
      </nav>
    </div>
  </div>


  <!-- ============================================================
       SCREEN 3 — MODE SELECT
  ============================================================ -->
  <div id="screen-mode" class="screen">
    <div class="grid-bg"></div>
    <button class="back-btn" onclick="goTo('screen-home')">← Back</button>
    <div class="logo" style="font-size:clamp(32px,5vw,58px); margin-bottom:4px;">Select Mode</div>
    <div class="logo-underline" style="margin-bottom:10px;"></div>
    <p class="mode-subtitle">Choose your battlefield</p>
    <nav class="menu">
      <button class="btn primary" onclick="goTo('screen-game'); startGame();"><span>PvE</span></button>
      <button class="btn disabled" disabled><span>PvP</span></button>
      <p class="coming-soon">Coming Soon</p>
      <button class="btn disabled" disabled><span>Sandbox</span></button>
      <p class="coming-soon">Coming Soon</p>
    </nav>
  </div>


  <!-- ============================================================
       SCREEN 4 — GAME
  ============================================================ -->
  <div id="screen-game" class="screen">

    <canvas id="c"></canvas>

    <button class="back-btn" onclick="returnToHome()">← Back</button>

    <!-- Hint button — top left, beside back button -->
    <button id="hint-btn" onclick="useHint()">💡 Hint</button>

    <!-- Hint popup — appears below the hint button -->
    <div id="hint-popup">
      <div class="hint-title">Hint</div>
      <div class="hint-body" id="hint-body"></div>
      <button class="hint-close" onclick="closeHint()">Close</button>
    </div>

    <div id="game-hud">
      <div id="game-title">Math Att✦que — PvE</div>
      <div id="hud"></div>
      <div id="form-badge"></div>
      <div id="modifier-badges"></div>
    </div>

    <div id="msg"></div>
    <div id="game-controls"></div>

  </div>


  <script>

    // ============================================================
    // CUSTOM CURSOR
    // ============================================================

    var cursorEl = document.getElementById("custom-cursor");
    document.addEventListener("mousemove", function(e) {
      cursorEl.style.left = e.clientX + "px";
      cursorEl.style.top  = e.clientY + "px";
    });


    // ============================================================
    // SCREEN NAVIGATION
    // ============================================================

    function goTo(screenId) {
      var allScreens = document.querySelectorAll(".screen");
      for (var i = 0; i < allScreens.length; i++) {
        allScreens[i].classList.remove("active");
      }
      document.getElementById(screenId).classList.add("active");
    }

    function returnToHome() {
      saveHighScore();
      goTo("screen-home");
    }


    // ============================================================
    // USERNAME
    // ============================================================

    function tryPlay() {
      var username = document.getElementById("username-input").value.trim();
      var errEl    = document.getElementById("username-error");
      if (username === "") {
        errEl.textContent = "⚠ Enter a username to continue";
        var inp = document.getElementById("username-input");
        inp.style.borderBottomColor = "#e02020";
        setTimeout(function() { inp.style.borderBottomColor = ""; }, 1200);
        return;
      }
      errEl.textContent = "";
      goTo("screen-mode");
    }


    // ============================================================
    // HIGH SCORE
    // Stores best level AND total hints used during that run.
    // ============================================================

    var highScore = { name: "", level: 0, hints: 0 };

    function saveHighScore() {
      var username = document.getElementById("username-input").value.trim();
      if (username === "") { username = "Anonymous"; }
      if (level > highScore.level) {
        highScore.name  = username;
        highScore.level = level;
        highScore.hints = hintsUsedTotal;  // how many hints used during this run
      }
      showHighScore();
    }

    function showHighScore() {
      var display = document.getElementById("highscore-display");
      if (highScore.level === 0) { display.textContent = ""; return; }
      display.innerHTML =
        "Best: <span class='hs-name'>" + highScore.name + "</span>" +
        " — Level <span class='hs-level'>" + highScore.level + "</span>" +
        "<br><span class='hs-hints'>Hints used: " + highScore.hints + "</span>";
    }


    // ============================================================
    // HINT SYSTEM
    // - One hint per level
    // - Reveals one useful variable for the current form
    // - Tracks total hints used across the whole run
    // ============================================================

    var hintUsedThisLevel = false;   // resets each level
    var hintsUsedTotal    = 0;       // accumulates across the whole run

    function useHint() {
      var btn = document.getElementById("hint-btn");

      // Block if already used this level or currently shooting
      if (hintUsedThisLevel) {
        setMessage("Hint already used this level.");
        return;
      }

      if (isShooting) { return; }

      hintUsedThisLevel  = true;
      hintsUsedTotal     = hintsUsedTotal + 1;

      // Grey out the hint button for this level
      btn.classList.add("used");
      btn.textContent = "💡 Hint (used)";

      // Build the hint text — one variable revealed per form
      var dx = enemyX - playerX;
      var dy = enemyY - playerY;
      var hintText = "";

      if (currentForm === "general") {
        // Reveal the correct value of b
        var aHint = -0.2;
        var bHint = (dy - aHint * dx * dx) / dx;
        hintText =
          "Try using  a = -0.2\n" +
          "Hint: the correct b ≈ " + bHint.toFixed(2) + "\n" +
          "(Use these values together to hit the target)";

      } else if (currentForm === "factored") {
        // Reveal r = 0 (shot starts at player, first root is at t=0)
        hintText =
          "In factored form  y = " + fixedA + "(x − r)(x − s)\n" +
          "Hint: try  r = 0\n" +
          "Then choose s so the parabola reaches the enemy's x-distance (" + dx.toFixed(1) + " units away).";

      } else if (currentForm === "vertex") {
        // Reveal the h value (horizontal position of the peak)
        var aV  = fixedA;
        var bV  = (dy - aV * dx * dx) / dx;
        var hV  = (-bV / (2 * aV)).toFixed(2);
        hintText =
          "In vertex form  y = " + fixedA + "(x − h)² + k\n" +
          "Hint: the peak should be around  h = " + hV + "\n" +
          "Adjust k to control the height of the arc.";
      }

      // Show the popup
      document.getElementById("hint-body").textContent = hintText;
      document.getElementById("hint-popup").classList.add("visible");
    }

    function closeHint() {
      document.getElementById("hint-popup").classList.remove("visible");
    }


    // ============================================================
    // INTRO VIDEO SEQUENCE
    // ============================================================

    var videoOpening = document.getElementById("video-opening");
    var videoLoading = document.getElementById("video-loading");

    function playOpeningVideo() {
      videoOpening.style.display = "block";
      videoLoading.style.display = "none";
      var fallback = setTimeout(playLoadingVideo, 6000);
      videoOpening.addEventListener("ended", function() { clearTimeout(fallback); playLoadingVideo(); });
      videoOpening.addEventListener("error",  function() { clearTimeout(fallback); playLoadingVideo(); });
      videoOpening.play().catch(function() { clearTimeout(fallback); playLoadingVideo(); });
    }

    function playLoadingVideo() {
      videoOpening.style.display = "none";
      videoLoading.style.display = "block";
      var fallback = setTimeout(goToHomeFn, 7000);
      videoLoading.addEventListener("ended", function() { clearTimeout(fallback); goToHomeFn(); });
      videoLoading.addEventListener("error",  function() { clearTimeout(fallback); goToHomeFn(); });
      videoLoading.play().catch(function() { clearTimeout(fallback); goToHomeFn(); });
    }

    function goToHomeFn() { goTo("screen-home"); }

    playOpeningVideo();


    // ============================================================
    // CANVAS SETUP
    // ============================================================

    var canvas = document.getElementById("c");
    var ctx    = canvas.getContext("2d");

    var GRID_COLS = 16;
    var GRID_ROWS = 10;
    var CANVAS_WIDTH, CANVAS_HEIGHT, CELL_WIDTH, CELL_HEIGHT;

    function resizeCanvas() {
      CANVAS_WIDTH  = window.innerWidth;
      CANVAS_HEIGHT = window.innerHeight;
      CELL_WIDTH    = CANVAS_WIDTH  / GRID_COLS;
      CELL_HEIGHT   = CANVAS_HEIGHT / GRID_ROWS;
      canvas.width  = CANVAS_WIDTH;
      canvas.height = CANVAS_HEIGHT;
    }

    window.addEventListener("resize", function() {
      resizeCanvas();
      if (typeof playerX !== "undefined") { draw(); }
    });


    // ============================================================
    // OFF-SCREEN TRACKER ARROW
    //
    // When the projectile flies above the top of the canvas we
    // draw a small arrow on the top edge pointing to where the
    // projectile would be horizontally.
    //
    // trackerPos: { px, py } in canvas pixels — the current
    //   projectile position even when off screen.
    //   null when there is no shot in flight.
    // ============================================================

    var trackerPos = null;   // set during shot animation, null otherwise

    function drawTracker() {
      if (trackerPos === null) { return; }

      // Only show the arrow when projectile is above the canvas top
      if (trackerPos.py >= 0) { return; }

      // Clamp the x position to the visible canvas width
      var arrowX = Math.max(20, Math.min(CANVAS_WIDTH - 20, trackerPos.px));
      var arrowY = 18;  // distance from top edge

      // Arrow size
      var aw = 10;  // half-width of arrowhead
      var ah = 14;  // height of arrowhead

      ctx.save();

      // Arrow shaft
      ctx.strokeStyle = "rgba(255, 220, 0, 0.9)";
      ctx.lineWidth   = 2;
      ctx.beginPath();
      ctx.moveTo(arrowX, arrowY + ah + 4);
      ctx.lineTo(arrowX, arrowY + ah + 14);
      ctx.stroke();

      // Arrowhead (pointing up, ↑)
      ctx.fillStyle = "rgba(255, 220, 0, 0.9)";
      ctx.beginPath();
      ctx.moveTo(arrowX,      arrowY);           // tip
      ctx.lineTo(arrowX - aw, arrowY + ah);      // bottom-left
      ctx.lineTo(arrowX + aw, arrowY + ah);      // bottom-right
      ctx.closePath();
      ctx.fill();

      // Small x-coordinate label below the arrow
      ctx.fillStyle = "rgba(255,220,0,0.7)";
      ctx.font      = "11px monospace";
      ctx.textAlign = "center";
      ctx.fillText("x=" + Math.round(trackerPos.px / CELL_WIDTH), arrowX, arrowY + ah + 26);

      ctx.restore();
    }


    // ============================================================
    // LEVEL MODIFIERS
    // ============================================================

    var walls = [];

    function shouldSpawnWalls() {
      return level >= 10 && !flippedParabola && Math.random() < 0.25;
    }

    function buildWalls() {
      walls = [];
      if (!shouldSpawnWalls()) { return; }
      var numWalls = Math.random() < 0.4 ? 2 : 1;
      var left  = playerX + 2;
      var right = enemyX  - 2;
      if (right - left < 2) { return; }
      for (var w = 0; w < numWalls; w++) {
        var attempts = 0;
        var wallCol;
        do {
          wallCol = left + Math.floor(Math.random() * (right - left + 1));
          attempts++;
        } while (isWallAt(wallCol) && attempts < 20);
        if (isWallAt(wallCol)) { continue; }
        var wallHeight = 2 + Math.floor(Math.random() * 4);
        walls.push({ gridX: wallCol, topGridY: wallHeight });
      }
    }

    function isWallAt(gridX) {
      for (var i = 0; i < walls.length; i++) {
        if (walls[i].gridX === gridX) { return true; }
      }
      return false;
    }

    function wallHeightAt(gridX) {
      for (var i = 0; i < walls.length; i++) {
        if (walls[i].gridX === gridX) { return walls[i].topGridY; }
      }
      return 0;
    }

    function isBlockedByWall(worldX, worldY) {
      var col = Math.round(worldX);
      var wh  = wallHeightAt(col);
      if (wh === 0) { return false; }
      return worldY <= wh && Math.abs(worldX - col) < 0.6;
    }


    // ============================================================
    // FLIPPED PARABOLA MODIFIER (level 15+)
    // ============================================================

    var flippedParabola = false;

    function rollFlippedParabola() {
      flippedParabola = level >= 15 && Math.random() < 0.20;
    }


    // ============================================================
    // LASER POWER-UP (every 10 levels)
    // ============================================================

    var laserCharges       = 0;
    var laserFiredThisShot = false;

    function checkLaserReward() {
      if (level % 10 === 0) {
        laserCharges++;
        setMessage("⚡ Laser power-up earned! (" + laserCharges + " charge" + (laserCharges > 1 ? "s" : "") + ")");
      }
    }


    // ============================================================
    // EQUATION FORMS
    // ============================================================

    var FORM_ORDER      = ["general", "factored", "vertex"];
    var FIXED_A_OPTIONS = [-0.1, -0.15, -0.2, -0.25, -0.3];
    var currentForm;
    var fixedA;

    function pickForm(levelNumber) {
      var index   = (levelNumber - 1) % FORM_ORDER.length;
      currentForm = FORM_ORDER[index];
      if (flippedParabola) {
        var posOpts = [0.1, 0.15, 0.2, 0.25, 0.3];
        fixedA = posOpts[Math.floor(Math.random() * posOpts.length)];
      } else {
        fixedA = FIXED_A_OPTIONS[Math.floor(Math.random() * FIXED_A_OPTIONS.length)];
      }
    }

    function renderControls() {
      var bar   = document.getElementById("game-controls");
      var badge = document.getElementById("form-badge");

      if (laserFiredThisShot) {
        badge.textContent = "Laser — Linear Form";
        bar.innerHTML =
          "<span class='label'>y =</span>" +
          "<input id='inputM' placeholder='m'>" +
          "<span class='label'>x +</span>" +
          "<input id='inputLB' placeholder='b'>" +
          "<button class='shoot-btn' onclick='shoot()'>Shoot Laser</button>";
        return;
      }

      var laserBtn = laserCharges > 0
        ? "<button class='laser-btn' onclick='activateLaser()'>⚡ Laser (" + laserCharges + ")</button>"
        : "";

      if (currentForm === "general") {
        badge.textContent = "General Form";
        bar.innerHTML =
          "<span class='label'>y =</span>" +
          "<input id='inputA' placeholder='a'>" +
          "<span class='label'>x² +</span>" +
          "<input id='inputB' placeholder='b'>" +
          "<span class='label'>x</span>" +
          laserBtn +
          "<button class='shoot-btn' onclick='shoot()'>Shoot</button>";

      } else if (currentForm === "factored") {
        badge.textContent = "Factored Form";
        bar.innerHTML =
          "<span class='label'>y =</span>" +
          "<span class='fixed'>" + fixedA + "</span>" +
          "<span class='label'>(x −</span>" +
          "<input id='inputR' placeholder='r'>" +
          "<span class='label'>)(x −</span>" +
          "<input id='inputS' placeholder='s'>" +
          "<span class='label'>)</span>" +
          laserBtn +
          "<button class='shoot-btn' onclick='shoot()'>Shoot</button>";

      } else if (currentForm === "vertex") {
        badge.textContent = "Vertex Form";
        bar.innerHTML =
          "<span class='label'>y =</span>" +
          "<span class='fixed'>" + fixedA + "</span>" +
          "<span class='label'>(x −</span>" +
          "<input id='inputH' placeholder='h'>" +
          "<span class='label'>)² +</span>" +
          "<input id='inputK' placeholder='k'>" +
          laserBtn +
          "<button class='shoot-btn' onclick='shoot()'>Shoot</button>";
      }
    }

    function activateLaser() {
      if (laserCharges <= 0) { return; }
      laserCharges--;
      laserFiredThisShot = true;
      renderControls();
      setMessage("⚡ Laser ready — enter m and b for a straight shot");
    }

    function readInputs() {
      if (laserFiredThisShot) {
        var m   = parseFloat(document.getElementById("inputM").value);
        var bLn = parseFloat(document.getElementById("inputLB").value);
        if (isNaN(m) || isNaN(bLn)) { setMessage("Enter m and b for the laser."); return null; }
        return { isLaser: true, m: m, bLin: bLn };
      }

      if (currentForm === "general") {
        var a = parseFloat(document.getElementById("inputA").value);
        var b = parseFloat(document.getElementById("inputB").value);
        if (isNaN(a) || isNaN(b))  { setMessage("Enter values for a and b."); return null; }
        if (Math.abs(a) < 0.05)    { setMessage("a is too small. Try -0.2");  return null; }
        if (flippedParabola && a < 0) { a = -a; }
        if (!flippedParabola && a > 0) { a = -a; }
        return { a: a, b: b };

      } else if (currentForm === "factored") {
        var r = parseFloat(document.getElementById("inputR").value);
        var s = parseFloat(document.getElementById("inputS").value);
        if (isNaN(r) || isNaN(s)) { setMessage("Enter values for r and s."); return null; }
        return { a: fixedA, b: -fixedA * (r + s) };

      } else if (currentForm === "vertex") {
        var h = parseFloat(document.getElementById("inputH").value);
        var k = parseFloat(document.getElementById("inputK").value);
        if (isNaN(h) || isNaN(k)) { setMessage("Enter values for h and k."); return null; }
        return { a: fixedA, b: -2 * fixedA * h };
      }
      return null;
    }

    function getAnswer() {
      var dx = enemyX - playerX;
      var dy = enemyY - playerY;
      if (currentForm === "general") {
        var a = flippedParabola ? 0.2 : -0.2;
        var b = (dy - a * dx * dx) / dx;
        return "a = " + a.toFixed(2) + ",  b = " + b.toFixed(2);
      }
      if (currentForm === "factored") { return "r = 0,  s = " + dx.toFixed(2); }
      if (currentForm === "vertex") {
        var aH  = fixedA;
        var bH  = (dy - aH * dx * dx) / dx;
        var hH  = (-bH / (2 * aH)).toFixed(2);
        return "h = " + hH + "  (test k values)";
      }
      return "";
    }


    // ============================================================
    // BARREL ANGLE
    // ============================================================

    function getBarrelAngle(a, b) {
      return Math.atan2(-b * CELL_HEIGHT, CELL_WIDTH);
    }


    // ============================================================
    // GAME STATE
    // ============================================================

    var level;
    var shotsLeft;
    var playerX, playerY;
    var enemyX,  enemyY;
    var lastAB     = null;
    var pastShots  = [];
    var isShooting = false;
    var particles  = [];

    function gridToPixel(gridX, gridY) {
      return {
        px: gridX * CELL_WIDTH,
        py: CANVAS_HEIGHT - gridY * CELL_HEIGHT
      };
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function placeDots() {
      playerX = randomInt(1, 3);
      playerY = randomInt(2, 6);
      enemyX  = randomInt(12, 15);
      enemyY  = randomInt(2, 6);
    }


    // ============================================================
    // EXPLOSION
    // ============================================================

    function spawnExplosion(px, py) {
      particles = [];
      for (var i = 0; i < 16; i++) {
        var angle = (i / 16) * Math.PI * 2;
        var speed = 3 + Math.random() * 4;
        particles.push({
          x: px, y: py,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0, radius: 4 + Math.random() * 4
        });
      }
    }

    function drawAndUpdateParticles() {
      var anyAlive = false;
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        if (p.life <= 0) { continue; }
        p.x += p.vx; p.y += p.vy; p.life -= 0.035;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 140, 0, " + p.life + ")";
        ctx.fill();
        anyAlive = true;
      }
      return anyAlive;
    }

    function animateExplosion(done) {
      draw();
      var stillGoing = drawAndUpdateParticles();
      if (stillGoing) {
        requestAnimationFrame(function() { animateExplosion(done); });
      } else {
        setTimeout(done, 200);
      }
    }


    // ============================================================
    // DRAW DOT WITH BARREL
    // ============================================================

    function drawDotWithBarrel(px, py, dotRadius, color, angle, barrelLen, barrelW) {
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(angle);
      ctx.fillStyle = color;
      ctx.fillRect(dotRadius - 2, -barrelW / 2, barrelLen, barrelW);
      ctx.restore();
      ctx.beginPath();
      ctx.arc(px, py, dotRadius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }


    // ============================================================
    // DRAW WALLS
    // ============================================================

    function drawWalls() {
      for (var i = 0; i < walls.length; i++) {
        var w      = walls[i];
        var bottom = gridToPixel(w.gridX, 0);
        var top    = gridToPixel(w.gridX, w.topGridY);

        var wallPxX = w.gridX * CELL_WIDTH - CELL_WIDTH * 0.15;
        var wallPxW = CELL_WIDTH * 0.3;
        var wallPxY = top.py;
        var wallPxH = bottom.py - top.py;

        ctx.fillStyle = "rgba(255, 140, 0, 0.25)";
        ctx.fillRect(wallPxX, wallPxY, wallPxW, wallPxH);
        ctx.strokeStyle = "orange";
        ctx.lineWidth   = 2;
        ctx.strokeRect(wallPxX, wallPxY, wallPxW, wallPxH);
        ctx.fillStyle = "orange";
        ctx.fillRect(wallPxX, wallPxY, wallPxW, 4);
        ctx.fillStyle   = "rgba(255,165,0,0.8)";
        ctx.font        = Math.floor(CELL_HEIGHT * 0.18) + "px monospace";
        ctx.textAlign   = "center";
        ctx.fillText("y≤" + w.topGridY, w.gridX * CELL_WIDTH, wallPxY - 6);
      }
    }


    // ============================================================
    // MODIFIER BADGES
    // ============================================================

    function updateModifierBadges() {
      var container = document.getElementById("modifier-badges");
      container.innerHTML = "";

      if (walls.length > 0) {
        var wb = document.createElement("div");
        wb.className = "mod-badge wall-badge";
        wb.textContent = "⚠ Walls Active";
        container.appendChild(wb);
      }
      if (flippedParabola) {
        var fb = document.createElement("div");
        fb.className = "mod-badge flip-badge";
        fb.textContent = "↑ Flipped Parabola (a > 0)";
        container.appendChild(fb);
      }
      if (laserCharges > 0) {
        var lb = document.createElement("div");
        lb.className = "mod-badge laser-badge";
        lb.textContent = "⚡ Laser x" + laserCharges;
        container.appendChild(lb);
      }
    }


    // ============================================================
    // DRAW
    // ============================================================

    function draw() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // Grid
      ctx.strokeStyle = "rgba(255,255,255,0.1)";
      ctx.lineWidth = 1;
      for (var col = 0; col <= GRID_COLS; col++) {
        ctx.beginPath();
        ctx.moveTo(col * CELL_WIDTH, 0);
        ctx.lineTo(col * CELL_WIDTH, CANVAS_HEIGHT);
        ctx.stroke();
      }
      for (var row = 0; row <= GRID_ROWS; row++) {
        ctx.beginPath();
        ctx.moveTo(0, row * CELL_HEIGHT);
        ctx.lineTo(CANVAS_WIDTH, row * CELL_HEIGHT);
        ctx.stroke();
      }

      // Axis numbers
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.font = Math.floor(CELL_HEIGHT * 0.2) + "px monospace";
      ctx.textAlign = "left";
      for (var i = 1; i <= GRID_COLS; i++) {
        ctx.fillText(i, i * CELL_WIDTH + 4, CANVAS_HEIGHT - 6);
      }
      for (var j = 1; j <= GRID_ROWS; j++) {
        ctx.fillText(j, 4, CANVAS_HEIGHT - j * CELL_HEIGHT - 4);
      }

      drawWalls();

      // Past shots
      ctx.strokeStyle = "rgba(120,160,255,0.18)";
      ctx.lineWidth = 2;
      for (var s = 0; s < pastShots.length; s++) {
        var path = pastShots[s];
        ctx.beginPath();
        for (var p = 0; p < path.length; p++) {
          if (p === 0) { ctx.moveTo(path[p].px, path[p].py); }
          else         { ctx.lineTo(path[p].px, path[p].py); }
        }
        ctx.stroke();
      }

      // Player dot + barrel
      var player = gridToPixel(playerX, playerY);
      var dotR   = Math.max(7, Math.min(CELL_WIDTH, CELL_HEIGHT) * 0.18);
      var bLen   = dotR * 2.2;
      var bW     = dotR * 0.7;
      var barrelAngle = lastAB ? getBarrelAngle(lastAB.a, lastAB.b) : 0;
      drawDotWithBarrel(player.px, player.py, dotR, "#0cc", barrelAngle, bLen, bW);
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.font = Math.floor(CELL_HEIGHT * 0.18) + "px monospace";
      ctx.textAlign = "left";
      ctx.fillText("(" + playerX + "," + playerY + ")", player.px + dotR + 6, player.py - 7);

      // Enemy dot
      var enemy = gridToPixel(enemyX, enemyY);
      ctx.beginPath();
      ctx.arc(enemy.px, enemy.py, dotR, 0, Math.PI * 2);
      ctx.fillStyle = "#e44";
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.fillText("(" + enemyX + "," + enemyY + ")", enemy.px + dotR + 6, enemy.py - 7);

      // Off-screen tracker arrow (drawn on top of everything else)
      drawTracker();
    }


    // ============================================================
    // SHOOT
    // ============================================================

    function shoot() {
      if (isShooting) { return; }
      if (shotsLeft <= 0) { setMessage("No shots left!"); return; }
      closeHint();  // close hint popup when shooting

      var inputs = readInputs();
      if (inputs === null) { return; }

      isShooting = true;
      setMessage("");

      if (inputs.isLaser) {
        shootLaser(inputs.m, inputs.bLin);
        return;
      }

      var a = inputs.a;
      var b = inputs.b;
      lastAB = { a: a, b: b };

      var path = [];
      var t    = 0;

      function step() {
        var worldX = playerX + t;
        var worldY = playerY + (a * t * t + b * t);
        var pos    = gridToPixel(worldX, worldY);

        // ── Always store tracker position (even if off screen) ──
        trackerPos = { px: pos.px, py: pos.py };

        // ── Only add to visible trail if on screen ──
        // We still add to path for reference, but only the visible
        // segment will be drawn
        path.push({ px: pos.px, py: pos.py, worldX: worldX, worldY: worldY });

        draw();   // draws grid, dots, tracker arrow

        // Draw the trail — only the visible portion
        ctx.beginPath();
        ctx.strokeStyle = flippedParabola ? "rgba(0,220,255,0.8)" : "rgba(255,255,255,0.75)";
        ctx.lineWidth = 2;
        var started = false;
        for (var i = 0; i < path.length; i++) {
          var pt = path[i];
          // Only draw points that are within the canvas
          if (pt.py >= 0 && pt.py <= CANVAS_HEIGHT && pt.px >= 0 && pt.px <= CANVAS_WIDTH) {
            if (!started) { ctx.moveTo(pt.px, pt.py); started = true; }
            else           { ctx.lineTo(pt.px, pt.py); }
          } else {
            // Gap in trail — reset so next visible point starts a new segment
            started = false;
          }
        }
        ctx.stroke();

        // Draw projectile dot only when on screen
        if (pos.px >= 0 && pos.px <= CANVAS_WIDTH && pos.py >= 0 && pos.py <= CANVAS_HEIGHT) {
          ctx.beginPath();
          ctx.arc(pos.px, pos.py, 5, 0, Math.PI * 2);
          ctx.fillStyle = flippedParabola ? "#0cf" : "#88aaff";
          ctx.fill();
        }

        // Wall collision
        if (isBlockedByWall(worldX, worldY)) {
          finishShot(path, false, pos.px, pos.py, "wall");
          return;
        }

        // Enemy hit
        if (isNearEnemy(pos.px, pos.py)) {
          finishShot(path, true, pos.px, pos.py, "hit");
          return;
        }

        t += 0.05;

        // ── FIXED CULLING:
        // Stop only when worldY falls BELOW ground (y < 0),
        // or the shot goes impossibly far sideways.
        // We no longer stop when going above the top — the tracker
        // arrow handles that case visually.
        var fellBelowGround = worldY < 0;
        var tooFarRight     = worldX > GRID_COLS + 8;
        var tTooLarge       = t > 60;  // safety cap to prevent infinite loops

        if (fellBelowGround || tooFarRight || tTooLarge) {
          finishShot(path, false, pos.px, pos.py, "oob");
        } else {
          requestAnimationFrame(step);
        }
      }

      step();
    }


    // ============================================================
    // LASER SHOT
    // ============================================================

    function shootLaser(m, bLin) {
      lastAB = { a: 0, b: m };
      var path = [];
      var t    = 0;

      function stepLaser() {
        var worldX = playerX + t;
        var worldY = m * t + playerY + bLin;
        var pos    = gridToPixel(worldX, worldY);

        trackerPos = { px: pos.px, py: pos.py };
        path.push({ px: pos.px, py: pos.py });

        draw();

        // Laser beam (visible segment only)
        ctx.beginPath();
        ctx.strokeStyle = "rgba(255,240,0,0.9)";
        ctx.lineWidth   = 3;
        ctx.shadowColor = "yellow";
        ctx.shadowBlur  = 8;
        var started = false;
        for (var i = 0; i < path.length; i++) {
          var pt = path[i];
          if (pt.py >= 0 && pt.py <= CANVAS_HEIGHT && pt.px >= 0 && pt.px <= CANVAS_WIDTH) {
            if (!started) { ctx.moveTo(pt.px, pt.py); started = true; }
            else           { ctx.lineTo(pt.px, pt.py); }
          } else {
            started = false;
          }
        }
        ctx.stroke();
        ctx.shadowBlur = 0;

        if (pos.px >= 0 && pos.px <= CANVAS_WIDTH && pos.py >= 0 && pos.py <= CANVAS_HEIGHT) {
          ctx.beginPath();
          ctx.arc(pos.px, pos.py, 4, 0, Math.PI * 2);
          ctx.fillStyle = "white";
          ctx.fill();
        }

        if (isBlockedByWall(worldX, worldY)) { finishShot(path, false, pos.px, pos.py, "wall"); return; }
        if (isNearEnemy(pos.px, pos.py))      { finishShot(path, true,  pos.px, pos.py, "hit");  return; }

        t += 0.05;

        var fellBelowGround = worldY < 0;
        var tooFarRight     = worldX > GRID_COLS + 8;
        var tTooLarge       = t > 60;

        if (fellBelowGround || tooFarRight || tTooLarge) {
          finishShot(path, false, pos.px, pos.py, "oob");
        } else {
          requestAnimationFrame(stepLaser);
        }
      }

      stepLaser();
    }


    // ============================================================
    // FINISH SHOT
    // ============================================================

    function isNearEnemy(px, py) {
      var enemy = gridToPixel(enemyX, enemyY);
      var dx = px - enemy.px;
      var dy = py - enemy.py;
      return Math.sqrt(dx * dx + dy * dy) < 14;
    }

    function finishShot(path, didHit, hitPx, hitPy, reason) {
      isShooting         = false;
      laserFiredThisShot = false;
      trackerPos         = null;   // clear the tracker arrow
      pastShots.push(path);
      if (pastShots.length > 20) { pastShots.shift(); }
      shotsLeft--;

      if (didHit) {
        setMessage("Hit!");
        spawnExplosion(hitPx, hitPy);
        animateExplosion(function() {
          level++;
          checkLaserReward();
          shotsLeft  = 5;
          pastShots  = [];
          particles  = [];
          lastAB     = null;
          startLevel();
        });
      } else {
        if (reason === "wall") { setMessage("Wall blocked your shot! Arc higher."); }

        if (shotsLeft <= 0) {
          saveHighScore();
          setMessage("Out of shots! Hint: " + getAnswer() + " — returning to menu…");
          setTimeout(function() { goTo("screen-home"); }, 3500);
        } else {
          if (reason !== "wall") { setMessage("Miss!"); }
          updateHUD();
          draw();
        }
      }
    }


    // ============================================================
    // HUD & MESSAGE
    // ============================================================

    function updateHUD() {
      document.getElementById("hud").textContent =
        "Level: " + level + "   |   Shots: " + shotsLeft;
      updateModifierBadges();
    }

    function setMessage(text) {
      document.getElementById("msg").textContent = text;
    }


    // ============================================================
    // START LEVEL
    // ============================================================

    function startLevel() {
      rollFlippedParabola();
      pickForm(level);
      placeDots();
      buildWalls();
      laserFiredThisShot = false;
      lastAB             = null;
      trackerPos         = null;

      // Reset hint for this level
      hintUsedThisLevel = false;
      var hintBtn = document.getElementById("hint-btn");
      hintBtn.classList.remove("used");
      hintBtn.textContent = "💡 Hint";
      closeHint();

      setMessage("");
      updateHUD();
      renderControls();
      resizeCanvas();
      draw();
    }


    // ============================================================
    // START GAME
    // ============================================================

    function startGame() {
      level              = 1;
      shotsLeft          = 5;
      pastShots          = [];
      particles          = [];
      isShooting         = false;
      lastAB             = null;
      laserCharges       = 0;
      laserFiredThisShot = false;
      walls              = [];
      flippedParabola    = false;
      trackerPos         = null;
      hintsUsedTotal     = 0;    // reset hint counter for new run
      hintUsedThisLevel  = false;
      startLevel();
    }

  </script>
</body>
</html>
