
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Math Attaque</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>

    :root {
      --red:       #e02020;
      --white:     #ffffff;
      --black:     #000000;
      --grey:      #aaaaaa;
      --grid-line: rgba(255,255,255,0.09);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: var(--black);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      color: var(--white);
    }

    /* ── SHARED GRID BACKGROUND ─────────────────────────────── */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── SCREEN BASE ────────────────────────────────────────── */
    .screen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--black);
    }

    .screen.active { display: flex; }

    /* ── LOGO ───────────────────────────────────────────────── */
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 8vw, 96px);
      letter-spacing: 5px;
      color: var(--white);
      display: flex;
      align-items: center;
      margin-bottom: 6px;
      position: relative;
      z-index: 2;
    }

    .logo .star { color: var(--red); }

    .logo-underline {
      width: min(480px, 72vw);
      height: 2px;
      background: var(--white);
      margin-bottom: 40px;
      position: relative;
      z-index: 2;
    }

    /* ── BUTTONS ────────────────────────────────────────────── */
    .menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      position: relative;
      z-index: 2;
    }

    .btn {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(18px, 2.8vw, 26px);
      letter-spacing: 4px;
      color: var(--white);
      background: transparent;
      border: 2px solid rgba(255,255,255,0.25);
      padding: 13px 60px;
      min-width: 280px;
      text-align: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--red);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.22s ease;
      z-index: 0;
    }

    .btn:hover::before  { transform: scaleX(1); }
    .btn:hover          { border-color: var(--red); }
    .btn span           { position: relative; z-index: 1; }
    .btn.primary        { background: var(--red); border-color: var(--red); }

    .btn.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: rgba(255,255,255,0.1);
    }
    .btn.disabled::before { display: none; }

    .coming-soon {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--grey);
      text-transform: uppercase;
      margin-top: -8px;
      position: relative;
      z-index: 2;
    }

    /* ── BACK BUTTON ────────────────────────────────────────── */
    .back-btn {
      position: absolute;
      top: 24px;
      left: 28px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 3px;
      color: var(--grey);
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
      z-index: 10;
    }

    .back-btn:hover { color: var(--white); }

    /* ── USERNAME INPUT ─────────────────────────────────────── */
    .username-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      position: relative;
      z-index: 2;
    }

    .username-row label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      color: var(--grey);
    }

    .username-row input {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      background: transparent;
      border: none;
      border-bottom: 2px solid rgba(255,255,255,0.3);
      color: var(--white);
      padding: 4px 8px;
      width: 200px;
      outline: none;
      transition: border-color 0.2s;
    }

    .username-row input::placeholder { color: rgba(255,255,255,0.2); }
    .username-row input:focus        { border-color: var(--red); }

    /* ── HIGH SCORE ─────────────────────────────────────────── */
    #highscore-display {
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--grey);
      text-transform: uppercase;
      margin-bottom: 34px;
      min-height: 18px;
      position: relative;
      z-index: 2;
    }

    #highscore-display .hs-name  { color: var(--white); }
    #highscore-display .hs-level { color: var(--red); }

    /* ── HOME SCREEN ────────────────────────────────────────── */
    #screen-home { justify-content: center; }

    .home-bg {
      position: absolute;
      inset: 0;
      background-image: url('Home_Page_Background.png');
      background-size: cover;
      background-position: top center;
      z-index: 0;
    }

    .home-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.25) 0%,
        rgba(0,0,0,0.62) 55%,
        rgba(0,0,0,0.96) 100%
      );
      z-index: 1;
    }

    .home-content {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── MODE SELECT ────────────────────────────────────────── */
    #screen-mode { background: var(--black); }

    .mode-subtitle {
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--grey);
      text-transform: uppercase;
      margin-bottom: 48px;
      position: relative;
      z-index: 2;
    }

    /* ── GAME SCREEN ────────────────────────────────────────── */
    #screen-game {
      background: var(--black);
      padding: 0;
      overflow: hidden;
      align-items: stretch;
      justify-content: stretch;
    }

    #c {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
      background: var(--black);
    }

    /* HUD — top right */
    #game-hud {
      position: absolute;
      top: 20px;
      right: 28px;
      z-index: 10;
      text-align: right;
    }

    #game-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 2px;
    }

    #hud {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      color: var(--white);
    }

    /* Form badge — shows which equation form this level uses */
    #form-badge {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--black);
      background: var(--red);
      padding: 3px 10px;
      margin-top: 6px;
      display: inline-block;
    }

    /* ── CONTROLS — bottom centre ───────────────────────────── */
    #game-controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.72);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 14px 28px;
      backdrop-filter: blur(6px);
      white-space: nowrap;
    }

    /* Static label text inside the controls bar */
    #game-controls .label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--white);
    }

    /* Fixed parts of the formula shown in grey */
    #game-controls .fixed {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.4);
    }

    #game-controls input {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      width: 65px;
      padding: 4px 8px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 3px;
      background: rgba(255,255,255,0.07);
      color: var(--white);
      outline: none;
      text-align: center;
      transition: border-color 0.2s;
    }

    #game-controls input:focus { border-color: var(--red); }

    #game-controls button {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      padding: 6px 20px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.07);
      color: var(--white);
      transition: background 0.2s, border-color 0.2s;
    }

    #game-controls button:hover       { background: var(--red); border-color: var(--red); }
    #game-controls button.shoot-btn   { background: var(--red); border-color: var(--red); }
    #game-controls button.shoot-btn:hover { background: #ff3a3a; }

    /* Message floats above the controls */
    #msg {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 4px;
      color: var(--red);
      min-height: 28px;
      white-space: nowrap;
    }

  </style>
</head>
<body>

  <!-- ============================================================
       SCREEN 1 — INTRO VIDEOS

       PUT YOUR VIDEO FILE PATHS IN THE src="" ATTRIBUTES BELOW:
         Video 1 (opening logo):   src="Opening Scene.mp4"
         Video 2 (loading screen): src="Loading screen (1).mp4"
  ============================================================ -->
  <div id="screen-intro" class="screen active">
    <div class="grid-bg"></div>

    <!-- VIDEO 1 — Opening logo. Replace src="" with your file path. -->
    <video id="video-opening" muted playsinline preload="auto"
           src="Opening Scene.mp4"
           style="position:relative;z-index:1;width:min(500px,80vw);height:min(500px,80vw);object-fit:contain;display:block;">
    </video>

    <!-- VIDEO 2 — Loading screen. Replace src="" with your file path. -->
    <video id="video-loading" muted playsinline preload="auto"
           src="Loading screen (1).mp4"
           style="position:relative;z-index:1;width:min(500px,80vw);height:min(500px,80vw);object-fit:contain;display:none;">
    </video>
  </div>


  <!-- ============================================================
       SCREEN 2 — HOME
  ============================================================ -->
  <div id="screen-home" class="screen">
    <div class="home-bg"></div>
    <div class="home-overlay"></div>
    <div class="grid-bg" style="z-index:2; opacity:0.5;"></div>

    <div class="home-content">
      <div class="logo">Math&nbsp;Att<span class="star">✦</span>que</div>
      <div class="logo-underline"></div>

      <div class="username-row">
        <label for="username-input">Player:</label>
        <input id="username-input" type="text" placeholder="Enter username" maxlength="20">
      </div>

      <div id="highscore-display"></div>

      <nav class="menu">
        <button class="btn primary" onclick="goTo('screen-mode')">
          <span>Play</span>
        </button>
      </nav>
    </div>
  </div>


  <!-- ============================================================
       SCREEN 3 — MODE SELECT
  ============================================================ -->
  <div id="screen-mode" class="screen">
    <div class="grid-bg"></div>
    <button class="back-btn" onclick="goTo('screen-home')">← Back</button>

    <div class="logo" style="font-size:clamp(32px,5vw,58px); margin-bottom:4px;">
      Select Mode
    </div>
    <div class="logo-underline" style="margin-bottom:10px;"></div>
    <p class="mode-subtitle">Choose your battlefield</p>

    <nav class="menu">
      <button class="btn primary" onclick="goTo('screen-game'); startGame();">
        <span>PvE</span>
      </button>
      <button class="btn disabled" disabled><span>PvP</span></button>
      <p class="coming-soon">Coming Soon</p>
      <button class="btn disabled" disabled><span>Sandbox</span></button>
      <p class="coming-soon">Coming Soon</p>
    </nav>
  </div>


  <!-- ============================================================
       SCREEN 4 — GAME
  ============================================================ -->
  <div id="screen-game" class="screen">

    <canvas id="c"></canvas>

    <button class="back-btn" onclick="returnToHome()">← Back</button>

    <!-- HUD top-right: title, level/shots, form badge -->
    <div id="game-hud">
      <div id="game-title">Math Att✦que — PvE</div>
      <div id="hud"></div>
      <div id="form-badge"></div>
    </div>

    <div id="msg"></div>

    <!-- Controls bar — rebuilt each level by renderControls() -->
    <div id="game-controls"></div>

  </div>


  <script>

    // ============================================================
    // SCREEN NAVIGATION
    // ============================================================

    function goTo(screenId) {
      var allScreens = document.querySelectorAll(".screen");
      for (var i = 0; i < allScreens.length; i++) {
        allScreens[i].classList.remove("active");
      }
      document.getElementById(screenId).classList.add("active");
    }

    function returnToHome() {
      saveHighScore();
      goTo("screen-home");
    }


    // ============================================================
    // HIGH SCORE
    // ============================================================

    var highScore = { name: "", level: 0 };

    function saveHighScore() {
      var username = document.getElementById("username-input").value.trim();
      if (username === "") { username = "Anonymous"; }
      if (level > highScore.level) {
        highScore.name  = username;
        highScore.level = level;
      }
      showHighScore();
    }

    function showHighScore() {
      var display = document.getElementById("highscore-display");
      if (highScore.level === 0) { display.textContent = ""; return; }
      display.innerHTML =
        "Best: <span class='hs-name'>" + highScore.name + "</span>" +
        " — Level <span class='hs-level'>" + highScore.level + "</span>";
    }


    // ============================================================
    // INTRO VIDEO SEQUENCE
    // ============================================================

    var videoOpening = document.getElementById("video-opening");
    var videoLoading = document.getElementById("video-loading");

    function playOpeningVideo() {
      videoOpening.style.display = "block";
      videoLoading.style.display = "none";
      var fallback = setTimeout(playLoadingVideo, 6000);
      videoOpening.addEventListener("ended", function () { clearTimeout(fallback); playLoadingVideo(); });
      videoOpening.addEventListener("error", function () { clearTimeout(fallback); playLoadingVideo(); });
      videoOpening.play().catch(function () { clearTimeout(fallback); playLoadingVideo(); });
    }

    function playLoadingVideo() {
      videoOpening.style.display = "none";
      videoLoading.style.display = "block";
      var fallback = setTimeout(goToHomeFn, 7000);
      videoLoading.addEventListener("ended", function () { clearTimeout(fallback); goToHomeFn(); });
      videoLoading.addEventListener("error", function () { clearTimeout(fallback); goToHomeFn(); });
      videoLoading.play().catch(function () { clearTimeout(fallback); goToHomeFn(); });
    }

    function goToHomeFn() { goTo("screen-home"); }

    playOpeningVideo();


    // ============================================================
    // CANVAS SETUP
    // ============================================================

    var canvas = document.getElementById("c");
    var ctx    = canvas.getContext("2d");

    var GRID_COLS = 16;
    var GRID_ROWS = 10;
    var CANVAS_WIDTH, CANVAS_HEIGHT, CELL_WIDTH, CELL_HEIGHT;

    function resizeCanvas() {
      CANVAS_WIDTH  = window.innerWidth;
      CANVAS_HEIGHT = window.innerHeight;
      CELL_WIDTH    = CANVAS_WIDTH  / GRID_COLS;
      CELL_HEIGHT   = CANVAS_HEIGHT / GRID_ROWS;
      canvas.width  = CANVAS_WIDTH;
      canvas.height = CANVAS_HEIGHT;
    }

    window.addEventListener("resize", function () {
      resizeCanvas();
      if (typeof playerX !== "undefined") { draw(); }
    });


    // ============================================================
    // EQUATION FORMS
    //
    // Each level picks one of three forms. The player fills in
    // different inputs depending on the form, but internally
    // all three get converted to the same a, b values used to
    // animate the projectile.
    //
    // The three forms are:
    //
    //   GENERAL:  y = ax² + bx
    //   Player enters: a, b
    //   (c is always 0 since the shot starts at the player dot)
    //
    //   FACTORED: y = a(x - r)(x - s)
    //   Player enters: r, s
    //   a is shown (fixed, chosen by the game)
    //   Expanding: y = a(x² - (r+s)x + rs)
    //   So b = -a(r+s),  and the shift from playerX is handled in shoot()
    //
    //   VERTEX:   y = a(x - h)² + k
    //   Player enters: h, k
    //   a is shown (fixed, chosen by the game)
    //   Expanding: y = a(x² - 2hx + h²) + k = ax² - 2ahx + ah² + k
    //   So b = -2ah,  and again the shift is handled in shoot()
    //
    // The order of forms cycles: general → factored → vertex → general...
    // Level 1 always starts with general.
    // ============================================================

    var FORM_ORDER = ["general", "factored", "vertex"];

    // The fixed value of 'a' shown to the player for factored and vertex.
    // We pick a clean negative value so the parabola always curves down.
    var FIXED_A_OPTIONS = [-0.1, -0.15, -0.2, -0.25, -0.3];

    // currentForm is set at the start of each level
    var currentForm;

    // fixedA is the 'a' value shown to the player for factored/vertex
    var fixedA;


    // ── Pick which form to use this level ───────────────────────
    // Level 1 → index 0 (general), level 2 → index 1 (factored), etc.
    function pickForm(levelNumber) {
      var index = (levelNumber - 1) % FORM_ORDER.length;
      currentForm = FORM_ORDER[index];

      // Pick a random clean 'a' value for factored and vertex forms
      fixedA = FIXED_A_OPTIONS[Math.floor(Math.random() * FIXED_A_OPTIONS.length)];
    }


    // ── Build the controls bar HTML for the current form ────────
    //
    // Each form shows a different equation with blank inputs.
    // The fixed parts (like 'a' in factored form) are shown in grey.
    // The inputs the player fills in are white boxes.
    //
    function renderControls() {
      var bar = document.getElementById("game-controls");
      var badge = document.getElementById("form-badge");

      if (currentForm === "general") {

        // y = [a]x² + [b]x
        badge.textContent = "General Form";
        bar.innerHTML =
          "<span class='label'>y =</span>" +
          "<input id='inputA' placeholder='a' title='Enter a (must be negative)'>" +
          "<span class='label'>x² +</span>" +
          "<input id='inputB' placeholder='b'>" +
          "<span class='label'>x</span>" +
          "<button class='shoot-btn' onclick='shoot()'>Shoot</button>" +
          "<button onclick='startLevel()'>Reset</button>";

      } else if (currentForm === "factored") {

        // y = [fixedA](x - [r])(x - [s])
        badge.textContent = "Factored Form";
        bar.innerHTML =
          "<span class='label'>y =</span>" +
          "<span class='fixed'>" + fixedA + "</span>" +
          "<span class='label'>(x −</span>" +
          "<input id='inputR' placeholder='r'>" +
          "<span class='label'>)(x −</span>" +
          "<input id='inputS' placeholder='s'>" +
          "<span class='label'>)</span>" +
          "<button class='shoot-btn' onclick='shoot()'>Shoot</button>" +
          "<button onclick='startLevel()'>Reset</button>";

      } else if (currentForm === "vertex") {

        // y = [fixedA](x - [h])² + [k]
        badge.textContent = "Vertex Form";
        bar.innerHTML =
          "<span class='label'>y =</span>" +
          "<span class='fixed'>" + fixedA + "</span>" +
          "<span class='label'>(x −</span>" +
          "<input id='inputH' placeholder='h'>" +
          "<span class='label'>)² +</span>" +
          "<input id='inputK' placeholder='k'>" +
          "<button class='shoot-btn' onclick='shoot()'>Shoot</button>" +
          "<button onclick='startLevel()'>Reset</button>";
      }
    }


    // ── Convert the player's inputs into a and b values ─────────
    //
    // No matter which form the player used, we convert to:
    //   worldY = playerY + (a * t² + b * t)
    // where t is the horizontal distance from the player.
    //
    // Returns { a, b } or null if inputs are invalid.
    //
    function readInputs() {

      if (currentForm === "general") {

        var a = parseFloat(document.getElementById("inputA").value);
        var b = parseFloat(document.getElementById("inputB").value);

        if (isNaN(a) || isNaN(b))     { setMessage("Enter values for a and b."); return null; }
        if (Math.abs(a) < 0.05)       { setMessage("a is too small. Try -0.2"); return null; }

        // Force downward curve
        if (a > 0) { a = -a; }

        return { a: a, b: b };

      } else if (currentForm === "factored") {

        // y = fixedA * (x - r)(x - s)
        // Expanding relative to playerX as origin:
        //   Let x = playerX + t
        //   y - playerY = fixedA * (playerX + t - r)(playerX + t - s)
        // Let u = t + (playerX - r), v = t + (playerX - s)
        //   = fixedA * (t + (playerX-r))(t + (playerX-s))
        //   = fixedA * (t² + ((playerX-r)+(playerX-s))*t + (playerX-r)(playerX-s))
        // But we want y(0) = playerY (the shot starts at the player dot),
        // which means the constant term must be 0.
        // The factored form already implies the shot starts at the player
        // only if playerX equals r or s — which it won't in general.
        // So instead we treat r and s as the x-intercepts of the
        // parabola in the SHIFTED coordinate (t = x - playerX):
        //   worldY = playerY + fixedA * (t - r)(t - s)
        // The player enters r and s as roots in the t-axis (distance from player).

        var r = parseFloat(document.getElementById("inputR").value);
        var s = parseFloat(document.getElementById("inputS").value);

        if (isNaN(r) || isNaN(s)) { setMessage("Enter values for r and s."); return null; }

        // Expand fixedA*(t-r)(t-s) = fixedA*t² - fixedA*(r+s)*t + fixedA*r*s
        // The constant term fixedA*r*s becomes the y-offset at t=0,
        // but we want y(0)=playerY, so we subtract it out:
        //   worldY = playerY + fixedA*t² - fixedA*(r+s)*t
        // This means the shot starts at the player and the roots (where
        // it crosses playerY again) are at t=r and t=s.

        var a = fixedA;
        var b = -fixedA * (r + s);

        return { a: a, b: b };

      } else if (currentForm === "vertex") {

        // y = fixedA*(x-h)² + k
        // In shifted coords (t = x - playerX):
        //   worldY = playerY + fixedA*(t - h)² + k
        // We want y(0) = playerY, so constant at t=0 must be 0:
        //   fixedA*h² + k = 0  →  k = -fixedA*h²
        // But the player enters k freely, so we allow k to shift the
        // whole arc up or down from the player's position:
        //   worldY = playerY + fixedA*(t-h)² + k
        // Expanding: fixedA*t² - 2*fixedA*h*t + fixedA*h² + k
        // The "extra constant" fixedA*h²+k shifts the starting height.
        // To keep the shot starting at the player dot we subtract it:
        //   worldY = playerY + fixedA*t² - 2*fixedA*h*t
        // and use k as the peak height above playerY:
        //   vertex is at t=h, peak height above playerY = k (if a<0)
        // So: a = fixedA, b = -2*fixedA*h, and the peak = playerY + k

        var h = parseFloat(document.getElementById("inputH").value);
        var k = parseFloat(document.getElementById("inputK").value);

        if (isNaN(h) || isNaN(k)) { setMessage("Enter values for h and k."); return null; }

        // Expand vertex form keeping y(0) = playerY:
        //   worldY = playerY + fixedA*(t-h)² + k - (fixedA*h² + k)
        //          = playerY + fixedA*t² - 2*fixedA*h*t
        var a = fixedA;
        var b = -2 * fixedA * h;

        return { a: a, b: b };
      }

      return null;
    }


    // ── Build the answer hint shown when shots run out ───────────
    // Works out what values the player should have entered.
    function getAnswer() {
      var dx = enemyX - playerX;
      var dy = enemyY - playerY;

      if (currentForm === "general") {
        // Pick a=-0.2 and solve for b
        var a = -0.2;
        var b = (dy - a * dx * dx) / dx;
        return "a = " + a.toFixed(2) + ",  b = " + b.toFixed(2);
      }

      if (currentForm === "factored") {
        // We need fixedA*t² - fixedA*(r+s)*t = dy at t=dx
        // fixedA*dx² - fixedA*(r+s)*dx = dy
        // -(r+s) = (dy - fixedA*dx²) / (fixedA*dx)
        // One root at t=dx (hits the enemy), another at t=0 means r=0, s=dx
        // But let's give a nicer hint: r=0 and s=dx
        var r = 0;
        var s = dx.toFixed(2);
        return "r = " + r + ",  s = " + s;
      }

      if (currentForm === "vertex") {
        // Peak is halfway between player and enemy: h = dx/2
        // At t=dx, worldY = playerY + fixedA*(dx-h)² - fixedA*h²
        // We just tell the player h = dx/2 and let them find k
        var h = (dx / 2).toFixed(2);
        // k can be anything; give the value that passes exactly through enemy
        // worldY(dx) = playerY + fixedA*dx² - 2*fixedA*h*dx
        // = playerY + fixedA*(dx² - 2*(dx/2)*dx)
        // = playerY + fixedA*(dx² - dx²)
        // = playerY  ← this only works if dy=0, so give a direct hint instead
        var hVal = dx / 2;
        var bVal = -2 * fixedA * hVal;
        // Use the general solution
        var aHint = fixedA;
        var bHint = (dy - aHint * dx * dx) / dx;
        var hHint = (-bHint / (2 * aHint)).toFixed(2);
        return "h = " + hHint + "  (find k by testing)";
      }

      return "no hint available";
    }


    // ============================================================
    // GAME STATE
    // ============================================================

    var level;
    var shotsLeft;
    var playerX, playerY;
    var enemyX,  enemyY;
    var pastShots  = [];
    var isShooting = false;
    var particles  = [];

    function gridToPixel(gridX, gridY) {
      return {
        px: gridX * CELL_WIDTH,
        py: CANVAS_HEIGHT - gridY * CELL_HEIGHT
      };
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function placeDots() {
      playerX = randomInt(1, 3);
      playerY = randomInt(2, 6);
      enemyX  = randomInt(12, 15);
      enemyY  = randomInt(2, 6);
    }


    // ============================================================
    // EXPLOSION PARTICLES
    // ============================================================

    function spawnExplosion(px, py) {
      particles = [];
      for (var i = 0; i < 16; i++) {
        var angle = (i / 16) * Math.PI * 2;
        var speed = 3 + Math.random() * 4;
        particles.push({
          x: px, y: py,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          radius: 4 + Math.random() * 4
        });
      }
    }

    function drawAndUpdateParticles() {
      var anyAlive = false;
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        if (p.life <= 0) continue;
        p.x    = p.x + p.vx;
        p.y    = p.y + p.vy;
        p.life = p.life - 0.035;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 140, 0, " + p.life + ")";
        ctx.fill();
        anyAlive = true;
      }
      return anyAlive;
    }

    function animateExplosion(done) {
      draw();
      var stillGoing = drawAndUpdateParticles();
      if (stillGoing) {
        requestAnimationFrame(function () { animateExplosion(done); });
      } else {
        setTimeout(done, 200);
      }
    }


    // ============================================================
    // DRAW
    // ============================================================

    function draw() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // Grid lines
      ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
      ctx.lineWidth = 1;
      for (var col = 0; col <= GRID_COLS; col++) {
        ctx.beginPath();
        ctx.moveTo(col * CELL_WIDTH, 0);
        ctx.lineTo(col * CELL_WIDTH, CANVAS_HEIGHT);
        ctx.stroke();
      }
      for (var row = 0; row <= GRID_ROWS; row++) {
        ctx.beginPath();
        ctx.moveTo(0, row * CELL_HEIGHT);
        ctx.lineTo(CANVAS_WIDTH, row * CELL_HEIGHT);
        ctx.stroke();
      }

      // Axis numbers
      ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
      ctx.font = Math.floor(CELL_HEIGHT * 0.2) + "px monospace";
      for (var i = 1; i <= GRID_COLS; i++) {
        ctx.fillText(i, i * CELL_WIDTH + 4, CANVAS_HEIGHT - 6);
      }
      for (var j = 1; j <= GRID_ROWS; j++) {
        ctx.fillText(j, 4, CANVAS_HEIGHT - j * CELL_HEIGHT - 4);
      }

      // Past shots
      ctx.strokeStyle = "rgba(120, 160, 255, 0.18)";
      ctx.lineWidth = 2;
      for (var s = 0; s < pastShots.length; s++) {
        var path = pastShots[s];
        ctx.beginPath();
        for (var p = 0; p < path.length; p++) {
          if (p === 0) ctx.moveTo(path[p].px, path[p].py);
          else ctx.lineTo(path[p].px, path[p].py);
        }
        ctx.stroke();
      }

      // Player dot
      var player = gridToPixel(playerX, playerY);
      ctx.beginPath();
      ctx.arc(player.px, player.py, 9, 0, Math.PI * 2);
      ctx.fillStyle = "#0cc";
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.font = Math.floor(CELL_HEIGHT * 0.18) + "px monospace";
      ctx.fillText("(" + playerX + "," + playerY + ")", player.px + 12, player.py - 7);

      // Enemy dot
      var enemy = gridToPixel(enemyX, enemyY);
      ctx.beginPath();
      ctx.arc(enemy.px, enemy.py, 9, 0, Math.PI * 2);
      ctx.fillStyle = "#e44";
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.fillText("(" + enemyX + "," + enemyY + ")", enemy.px + 12, enemy.py - 7);
    }


    // ============================================================
    // SHOOT
    // ============================================================

    function shoot() {
      if (isShooting) return;
      if (shotsLeft <= 0) { setMessage("No shots left — press Reset!"); return; }

      // Read and validate inputs based on current form
      var inputs = readInputs();
      if (inputs === null) { return; }

      var a = inputs.a;
      var b = inputs.b;

      isShooting = true;
      setMessage("");

      var path = [];
      var t = 0;

      function step() {
        var worldX = playerX + t;
        var worldY = playerY + (a * t * t + b * t);
        var pos    = gridToPixel(worldX, worldY);

        path.push(pos);
        draw();

        // Shot trail
        ctx.beginPath();
        ctx.strokeStyle = "rgba(255,255,255,0.75)";
        ctx.lineWidth = 2;
        for (var i = 0; i < path.length; i++) {
          if (i === 0) ctx.moveTo(path[i].px, path[i].py);
          else ctx.lineTo(path[i].px, path[i].py);
        }
        ctx.stroke();

        // Projectile dot
        ctx.beginPath();
        ctx.arc(pos.px, pos.py, 5, 0, Math.PI * 2);
        ctx.fillStyle = "#88aaff";
        ctx.fill();

        if (isNearEnemy(pos.px, pos.py)) {
          finishShot(path, true, pos.px, pos.py);
          return;
        }

        t = t + 0.05;

        if (worldX > 0 && worldX < GRID_COLS && worldY > 0 && worldY < GRID_ROWS) {
          requestAnimationFrame(step);
        } else {
          finishShot(path, false, pos.px, pos.py);
        }
      }

      step();
    }

    function isNearEnemy(px, py) {
      var enemy = gridToPixel(enemyX, enemyY);
      var dx = px - enemy.px;
      var dy = py - enemy.py;
      return Math.sqrt(dx * dx + dy * dy) < 14;
    }

    function finishShot(path, didHit, hitPx, hitPy) {
      isShooting = false;
      pastShots.push(path);
      if (pastShots.length > 20) pastShots.shift();
      shotsLeft = shotsLeft - 1;

      if (didHit) {
        setMessage("Hit!");
        spawnExplosion(hitPx, hitPy);
        animateExplosion(function () {
          level     = level + 1;
          shotsLeft = 5;
          pastShots = [];
          particles = [];
          startLevel();       // picks new form, new dots, redraws
        });
      } else {
        if (shotsLeft <= 0) {
          setMessage("Out of shots!  Hint: " + getAnswer());
        } else {
          setMessage("Miss!");
        }
        updateHUD();
        draw();
      }
    }

    function updateHUD() {
      document.getElementById("hud").textContent =
        "Level: " + level + "   |   Shots: " + shotsLeft;
    }

    function setMessage(text) {
      document.getElementById("msg").textContent = text;
    }


    // ============================================================
    // START LEVEL
    // Called at the start of each new level (including level 1).
    // Picks the form, places dots, rebuilds controls.
    // ============================================================

    function startLevel() {
      pickForm(level);          // sets currentForm and fixedA
      placeDots();              // sets playerX/Y, enemyX/Y
      setMessage("");
      updateHUD();
      renderControls();         // rebuilds the input bar for the new form
      resizeCanvas();
      draw();
    }


    // ============================================================
    // START GAME — resets everything back to level 1
    // ============================================================

    function startGame() {
      level      = 1;
      shotsLeft  = 5;
      pastShots  = [];
      particles  = [];
      isShooting = false;
      startLevel();
    }

  </script>
</body>
</html>
